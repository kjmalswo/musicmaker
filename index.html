const DB=GAME_DATABASE,E=DB.engine,U=DB.ui;
const byId=(table,id)=>DB[table].find(item=>item.id===id);
const clamp=(value,min=0,max=E.numeric.unit)=>Math.min(max,Math.max(min,value));
const percent=value=>Math.round(value*E.numeric.percent);
const fmt=(template,values={})=>template.replace(/\{(\w+)\}/g,(_,key)=>String(values[key]??''));
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const error=(id,values)=>new Error(fmt(U[id],values));
const pc=value=>((value%E.numeric.octave)+E.numeric.octave)%E.numeric.octave;
const sum=values=>values.reduce((a,b)=>a+b,0);
const average=values=>sum(values)/values.length;
const pitchName=(value,key,octave=false)=>DB.pitchNames[key.flat?'flat':'sharp'][pc(value)]+(octave?Math.floor(value/E.numeric.octave)-E.numeric.midiOctaveOffset:'');

function normalizeConfig(input={}){
 const config={};
 for(const field of DB.fields){
  const value=input[field.id]??DB.defaults[field.id];
  if(field.type==='select')config[field.id]=byId(field.table,value)?value:DB.defaults[field.id];
  else if(field.type==='number'||field.type==='range'){
   const number=Number(value);
   config[field.id]=Number.isFinite(number)?clamp(Math.round(number/field.increment)*field.increment,field.min,field.max):DB.defaults[field.id];
  }else config[field.id]=String(value).trim().slice(0,field.maxLength);
 }
 if(!new RegExp(E.validation.seedPattern).test(config.seed))throw error('seedError');
 return config;
}

function seededRandom(seed){
 let state=E.seed.offset;
 for(const char of seed)state=Math.imul(state^char.codePointAt(0),E.seed.prime)>>>0;
 return()=>{
  state=(state+E.seed.step)>>>0;
  let value=state;
  value=Math.imul(value^(value>>>E.seed.shiftA),value|E.numeric.unit);
  value^=value+Math.imul(value^(value>>>E.seed.shiftB),value|E.seed.mix);
  return((value^(value>>>E.seed.shiftC))>>>0)/E.seed.denominator;
 };
}

function makeContext(config){
 const genre=byId('genres',config.genre),mood=byId('moods',config.mood),style=byId('styles',config.style),meter=byId('meters',config.meter),mode=byId('modes',config.mode),key=byId('keys',config.key);
 const jazz=config.jazzy/E.numeric.percent,classical=config.classical/E.numeric.percent,complexity=config.complexity/E.numeric.percent,variation=config.variation/E.numeric.percent;
 const energy=clamp(config.energy/E.numeric.percent*E.blend.energyUser+genre.energy*E.blend.energyGenre+mood.energy*E.blend.energyMood);
 const complexityTarget=complexity*E.blend.complexUser+genre.complexity*E.blend.complexGenre;
 const extensionTarget=jazz*(genre.extension*E.blend.extensionGenre+complexityTarget*E.blend.extensionComplex);
 let hold=genre.hold;
 if(complexityTarget>E.harmonicRhythm.fastThreshold&&config.bpm<E.harmonicRhythm.fastTempo)hold=E.harmonicRhythm.fastHold;
 else if(complexityTarget<E.harmonicRhythm.slowThreshold||config.bpm>E.harmonicRhythm.fastTempo)hold=E.harmonicRhythm.slowHold;
 else if(config.bpm<E.harmonicRhythm.slowTempo)hold=E.harmonicRhythm.normalHold;
 const swing=meter.noSwing?0:jazz*(genre.swing*E.swing.genre+style.swing*E.swing.style);
 const orchestra=Math.round(classical*E.orchestra.max*(E.orchestra.styleBase+style.orchestra*E.orchestra.styleWeight));
 const baseChords=[...mode.chords.map(chord=>({...chord,source:'diatonic'})),...mode.borrowed.map(chord=>({...chord,source:'borrowed'})),...mode.applied.map(chord=>({...chord,source:'applied'}))];
 const progression=byId('progressions',config.progression);
 let forced=progression.modes?.[mode.id]??null;
 if(config.progression==='custom'){
  forced=config.customProgression.split(new RegExp(E.validation.customSplit)).filter(Boolean);
  if(!E.limits.customLengths.includes(forced.length)||forced.some(id=>!baseChords.some(chord=>chord.id===id)))throw error('progressionError',{tokens:baseChords.map(chord=>chord.id).join(U.listSeparator)});
  const unresolved=forced.filter((id,index)=>{const chord=baseChords.find(item=>item.id===id);return chord.target&&forced[(index+E.numeric.unit)%forced.length]!==chord.target;});
  if(unresolved.length)throw error('appliedError',{pairs:unresolved.map(id=>`${id} → ${baseChords.find(chord=>chord.id===id).target}`).join(U.listSeparator)});
 }
 return{config,genre,mood,style,meter,mode,key,jazz,classical,variation,energy,complexityTarget,extensionTarget,hold,swing,orchestra,baseChords,forced,borrowRate:jazz*E.chromatic.borrowMax*genre.borrow,appliedRate:jazz*E.chromatic.appliedMax*genre.applied};
}

function candidateChords(ctx){
 return ctx.baseChords.flatMap(chord=>DB.qualities[chord.quality].filter(quality=>{
  if(quality.level>ctx.jazz+E.chromatic.extensionSlack&&quality.level!==0)return false;
  // Extensions of a diatonic chord must fit the scale or its existing altered triad.
  const allowed=new Set([...ctx.mode.scale,...DB.qualities[chord.quality][0].tones.map(interval=>pc(chord.degree+interval))]);
  return chord.source!=='diatonic'||quality.tones.every(interval=>allowed.has(pc(chord.degree+interval)));
 }).map(quality=>{
  const root=pc(ctx.key.pc+chord.degree);
  const result={...chord,...quality,root,symbol:pitchName(root,ctx.key)+quality.suffix,uid:`${chord.id}:${quality.suffix}`,tension:clamp(chord.tension+quality.extra)};
  result.voicings=voicingCandidates(result);
  return result;
 }));
}

function voicingCandidates(chord){
 const result=[],seen=new Set();
 for(let inversion=0;inversion<chord.voices.length;inversion++){
  const rotated=[...chord.voices.slice(inversion),...chord.voices.slice(0,inversion).map(note=>note+E.numeric.octave)].map(note=>note+chord.root+E.voicing.lower);
  for(let index=E.numeric.unit;index<rotated.length;index++)while(rotated[index]<=rotated[index-E.numeric.unit])rotated[index]+=E.numeric.octave;
  for(const shift of E.voicing.octaveShifts){
   const notes=rotated.map(note=>note+shift*E.numeric.octave),signature=notes.join(',');
   if(notes[0]>=E.voicing.lower&&notes.at(-1)<=E.voicing.upper&&!seen.has(signature)){seen.add(signature);result.push(notes);}
  }
 }
 return result;
}

function voiceCost(before,after,ctx){
 const motion=sum(after.map((note,index)=>Math.abs(note-before[index])));
 let parallels=0;
 for(let lower=0;lower<before.length;lower++)for(let upper=lower+E.numeric.unit;upper<before.length;upper++){
  const intervalBefore=pc(before[upper]-before[lower]),intervalAfter=pc(after[upper]-after[lower]);
  const lowerMove=after[lower]-before[lower],upperMove=after[upper]-before[upper];
  if(E.voicing.perfectIntervals.includes(intervalBefore)&&intervalBefore===intervalAfter&&lowerMove!==0&&Math.sign(lowerMove)===Math.sign(upperMove))parallels++;
 }
 const leap=sum(after.map((note,index)=>Math.max(0,Math.abs(note-before[index])-E.voicing.largeLeap)));
 return{motion,parallels,cost:motion*(E.weights.voice+ctx.classical*E.weights.classicalVoice)+parallels*(E.weights.parallel+ctx.classical*E.weights.classicalParallel)+leap*E.voicing.upperStepPenalty};
}

function pairVoiceCost(a,b,ctx,cache){
 const id=`${a.uid}|${b.uid}`;
 if(!cache.has(id))cache.set(id,Math.min(...a.voicings.flatMap(before=>b.voicings.map(after=>voiceCost(before,after,ctx).cost))));
 return cache.get(id);
}

function optimizeVoicings(chords,ctx,previous=null){
 let paths=[{cost:0,notes:[],motion:0,last:previous}];
 for(const chord of chords){
  paths=chord.voicings.map(notes=>{
   const options=paths.map(path=>{
    const move=path.last?voiceCost(path.last,notes,ctx):{cost:0,motion:0};
    return{cost:path.cost+move.cost+Math.abs(average(notes)-E.voicing.center)*E.voicing.centerWeight,notes:[...path.notes,notes],motion:path.motion+move.motion,last:notes};
   });
   return options.sort((a,b)=>a.cost-b.cost)[0];
  });
 }
 return paths.sort((a,b)=>a.cost-b.cost)[0];
}

function targetTension(ctx,type,index,length,occurrence){
 const progress=index/(length-E.numeric.unit);
 return clamp(ctx.mood.tension*E.blend.tensionMood+type.tension*E.blend.tensionSection+ctx.complexityTarget*E.blend.tensionComplex+Math.sin(progress*E.tensionCurve.frequency)*E.tensionCurve.middle+E.tensionCurve.start*(E.numeric.unit-progress)+E.tensionCurve.end*progress+occurrence*ctx.variation*E.tensionCurve.repeatLift);
}

function searchProgression(ctx,type,length,random,candidates,previousMotif,pairCache,occurrence){
 const forced=ctx.forced,borrowBudget=Math.floor(length*ctx.borrowRate),appliedBudget=Math.floor(length*ctx.appliedRate);
 let beam=[{path:[],score:0,borrowed:0,applied:0,run:0}],evaluations=0;
 const noise=Array.from({length},()=>new Map(candidates.map(chord=>[chord.uid,(random()-E.swing.base)*E.weights.jitter])));
 for(let index=0;index<length;index++){
  const next=[],last=index===length-E.numeric.unit,penultimate=index===length-E.numeric.unit-E.numeric.unit,target=targetTension(ctx,type,index,length,occurrence);
  for(const state of beam)for(const chord of candidates){
   if(forced&&chord.id!==forced[index%forced.length])continue;
   if(!forced&&chord.source==='borrowed'&&state.borrowed>=borrowBudget)continue;
   if(!forced&&chord.source==='applied'&&state.applied>=appliedBudget)continue;
   const before=state.path.at(-1);
   if(before?.target&&before.target!==chord.id)continue;
   if(last&&chord.target&&(!forced||forced[0]!==chord.target))continue;
   if(!forced&&last&&type.closure==='T'&&chord.id!==ctx.mode.tonic)continue;
   if(!forced&&last&&type.closure==='D'&&chord.id!==ctx.mode.dominant)continue;
   if(!forced&&penultimate&&type.closure==='T'&&ctx.classical>=E.thresholds.classicalRhythm&&chord.id!==ctx.mode.dominant)continue;
   evaluations++;
   let score=state.score-Math.abs(chord.tension-target)*E.weights.tension;
   score+=(ctx.genre.degrees[chord.id]??E.numeric.unit)*E.weights.genre;
   score-=Math.abs(chord.level-ctx.extensionTarget)*E.weights.extension;
   score+=(chord.quality==='major'?ctx.mood.valence:E.numeric.unit-ctx.mood.valence)*E.weights.brightness+noise[index].get(chord.uid);
   if(chord.source==='borrowed')score+=ctx.jazz*E.weights.borrow-Math.abs(chord.tension-target)*E.weights.color;
   if(chord.source==='applied')score+=ctx.jazz*E.weights.applied;
   let run=0;
   if(before){
    score+=E.functionTransitions[before.fn][chord.fn]*E.weights.function*(E.numeric.unit+ctx.classical);
    const interval=pc(chord.root-before.root),distance=Math.min(interval,E.numeric.octave-interval);
    score+=E.rootMotion[distance]*E.weights.root;
    score-=pairVoiceCost(before,chord,ctx,pairCache);
    if(before.id===chord.id){run=state.run+E.numeric.unit;score-=E.weights.repeat+run*E.weights.run;}
    if(before.source==='borrowed'&&chord.source==='borrowed')score-=E.thresholds.borrowNeighborPenalty;
   }else if(chord.id===ctx.mode.tonic)score+=E.weights.startTonic;
   if(!state.path.some(item=>item.id===chord.id))score+=ctx.variation*E.weights.diversity;
   if(last&&!forced&&type.closure!=='open')score+=E.weights.cadence*ctx.classical;
   if(previousMotif){
    const reference=previousMotif[index%previousMotif.length],lock=index<length*E.thresholds.repeatLock;
    if(chord.id===reference.id)score+=(E.numeric.unit-ctx.variation)*E.weights.motif+(lock?E.weights.motif:0);
    else if(!lock)score+=ctx.variation*E.weights.novelty;
   }
   next.push({path:[...state.path,chord],score,borrowed:state.borrowed+(chord.source==='borrowed'?E.numeric.unit:0),applied:state.applied+(chord.source==='applied'?E.numeric.unit:0),run});
  }
  if(!next.length)throw error('noPath');
  beam=next.sort((a,b)=>b.score-a.score).slice(0,E.limits.beamWidth);
 }
 return{...beam[0],evaluations,borrowBudget,appliedBudget};
}

function chooseInstruments(ctx,energy,occurrence,random){
 const score=item=>(ctx.genre.instruments[item.id]??0)*E.arrangement.genre+(ctx.style.instrument[item.id]??0)*E.arrangement.style+item.jazz*ctx.jazz*E.arrangement.jazz+item.classical*ctx.classical*E.arrangement.classical+item.base*E.arrangement.base+random()*E.arrangement.jitter;
 const ranked=DB.instruments.map(item=>({...item,score:score(item)})).sort((a,b)=>b.score-a.score);
 const core=E.arrangement.roles.map(role=>ranked.find(item=>item.role===role)).filter(Boolean);
 const textureCount=ctx.classical<E.orchestra.threshold?0:Math.min(ctx.orchestra,Math.max(E.numeric.unit,Math.round(ctx.orchestra*(E.numeric.unit-E.arrangement.textureEnergy+energy*E.arrangement.textureEnergy))));
 const textures=ranked.filter(item=>item.role==='texture').slice(0,textureCount);
 return{instruments:[...core,...textures],textures:textures.length,tracks:core.length+textures.length+Math.round(energy*E.arrangement.extraTracks)+Math.round(occurrence*ctx.variation*E.arrangement.repeatTracks)};
}

function makeSection(ctx,definition,index,occurrences,motifs,random,candidates,pairCache,previousVoice){
 const[kind,bars]=definition,type=DB.sectionTypes[kind],occurrence=occurrences[kind]??0;
 occurrences[kind]=occurrence+E.numeric.unit;
 let hold=ctx.hold,length;
 if(ctx.forced){length=ctx.forced.length;hold=Math.min(hold,bars/length);}
 else{length=Math.min(E.limits.maxPattern,bars/hold);if(length<E.limits.minPattern){length=E.limits.minPattern;hold=bars/length;}}
 // Keep a whole number of complete phrases even when DB song forms gain new lengths.
 const repeats=Math.max(E.numeric.unit,Math.floor(bars/(length*hold)));
 hold=bars/(length*repeats);
 const search=searchProgression(ctx,type,length,random,candidates,motifs[kind],pairCache,occurrence);
 if(!motifs[kind])motifs[kind]=search.path;
 const fullPath=Array.from({length:repeats},()=>search.path).flat(),voicings=optimizeVoicings(fullPath,ctx,previousVoice);
 const energy=clamp(ctx.energy*type.energy+occurrence*ctx.variation*E.tensionCurve.repeatLift);
 const density=clamp((ctx.style.density*E.density.style+energy*E.density.energy+ctx.complexityTarget*E.density.complexity)*type.density);
 const pattern=ctx.classical>=E.thresholds.classicalRhythm?ctx.meter.classical:ctx.meter.patterns[density<E.density.sparse?'sparse':density>E.density.dense?'dense':'medium'];
 const arrangement=chooseInstruments(ctx,energy,occurrence,random),label=type.label+(occurrence?` ${occurrence+E.numeric.unit}`:'');
 const cadence=ctx.forced||type.closure==='open'?U.cadenceOpen:type.closure==='T'?U.cadenceResolved:U.cadenceDominant;
 const events=fullPath.map((chord,eventIndex)=>{
  const notes=voicings.notes[eventIndex],bass=E.voicing.bassBase+chord.root;
  return{id:chord.id,symbol:chord.symbol,source:chord.source,fn:chord.fn,level:chord.level,tension:chord.tension,target:chord.target??null,root:chord.root,tones:chord.tones.map(interval=>pc(chord.root+interval)),notes,bass,voicing:notes.map(note=>pitchName(note,ctx.key,true)).join(U.noteSeparator),bassName:pitchName(bass,ctx.key,true),bar:eventIndex*hold,duration:hold};
 });
 const notes=ctx.mode.scale.map(interval=>pitchName(ctx.key.pc+interval,ctx.key)).join(U.listSeparator);
 return{kind,label,index,bars,hold,repeats,phraseBars:length*hold,patternLength:length,occurrence,energy:percent(energy),density:percent(density),targetTension:percent(average(search.path.map((_,i)=>targetTension(ctx,type,i,length,occurrence)))),events,phrase:events.slice(0,length),cadence,arrangement,rhythm:fmt(U.rhythmLine,{groove:ctx.genre.groove,pattern,density:percent(density),accents:ctx.meter.accents}),melody:fmt(U.melodyLine,{scale:ctx.mode.scaleLabel,notes,contour:ctx.mood.contour,motif:ctx.style.motif}),evaluations:search.evaluations,score:Number(search.score.toFixed(E.display.scoreDigits)),motion:voicings.motion,lastVoice:voicings.last};
}

function generateGuide(input){
 const config=normalizeConfig(input),ctx=makeContext(config),random=seededRandom(config.seed),candidates=candidateChords(ctx),form=byId('forms',config.form);
 const occurrences={},motifs={},pairCache=new Map(),sections=[];
 let start=E.numeric.unit,previousVoice=null;
 for(const[index,definition]of form.sections.entries()){
  const section=makeSection(ctx,definition,index,occurrences,motifs,random,candidates,pairCache,previousVoice);
  section.start=start;section.end=start+section.bars-E.numeric.unit;start+=section.bars;previousVoice=section.lastVoice;delete section.lastVoice;sections.push(section);
 }
 for(const[index,section]of sections.entries()){
  const next=sections[index+E.numeric.unit];
  section.transition=next?fmt(U.transitionLine,{next:next.label,transition:ctx.style.transition,energy:section.energy,nextEnergy:next.energy}):U.lastTransition;
 }
 const bars=sum(sections.map(section=>section.bars)),seconds=Math.round(bars*ctx.meter.quarters/ctx.meter.pulseQuarters*E.numeric.secondsPerMinute/config.bpm),events=sections.flatMap(section=>section.events);
 const diagnostics={evaluations:sum(sections.map(section=>section.evaluations)),borrowed:percent(events.filter(event=>event.source==='borrowed').length/events.length),applied:percent(events.filter(event=>event.source==='applied').length/events.length),extension:percent(events.filter(event=>event.level>0).length/events.length),swing:percent(ctx.swing),orchestra:ctx.orchestra};
 const harmony=[{title:U.harmonicDirection,body:fmt(U.harmonicDirectionBody,{jazz:config.jazzy,extension:percent(ctx.extensionTarget),borrowBudget:percent(ctx.borrowRate),appliedBudget:percent(ctx.appliedRate)})},{title:U.voiceDirection,body:fmt(U.voiceDirectionBody,{classical:config.classical})},{title:U.densityDirection,body:fmt(U.densityDirectionBody,{hold:ctx.hold,variation:config.variation})}];
 const melody=[{title:U.rhythmDirection,body:fmt(U.rhythmDirectionBody,{groove:ctx.genre.groove,swing:percent(ctx.swing),density:percent(ctx.style.density*E.density.style+ctx.energy*E.density.energy+ctx.complexityTarget*E.density.complexity),meterAdvice:ctx.meter.advice})},{title:U.motifDirection,body:fmt(U.motifDirectionBody,{motif:ctx.style.motif,styleMelody:ctx.style.melody})},{title:U.blueDirection,body:ctx.jazz>E.thresholds.blue?fmt(U.blueHigh,{blue:percent(ctx.jazz*E.chromatic.blueMax),blueNotes:`${ctx.mode.blueLabel} (${ctx.mode.blue.map(interval=>pitchName(ctx.key.pc+interval,ctx.key)).join(U.listSeparator)})`}):U.blueLow}];
 const daw=U.dawSteps.map(template=>fmt(template,{bpm:config.bpm,meter:ctx.meter.label,bars,groove:ctx.genre.groove,hold:ctx.hold,motif:ctx.style.motif,orchestra:ctx.orchestra}));
 return{version:DB.version,config,bars,seconds,sections,diagnostics,harmony,melody,daw,summary:{title:fmt(U.briefTitle,{mood:ctx.mood.label,genre:ctx.genre.label}),subtitle:fmt(U.briefSubtitle,{key:ctx.key.label,mode:ctx.mode.label,style:ctx.style.label,meter:ctx.meter.label,form:form.label}),notice:ctx.forced?U.fixedNotice:U.autoNotice,orchestral:ctx.orchestra?U.orchestralHigh:U.orchestralLow}};
}

function validateDatabase(){
 for(const table of['fields','genres','moods','styles','meters','keys','modes','forms','progressions','instruments']){
  const ids=DB[table].map(entry=>entry.id);if(new Set(ids).size!==ids.length)throw error('dbError',{detail:table});
 }
 for(const field of DB.fields)if(field.type==='select'&&!byId(field.table,DB.defaults[field.id]))throw error('dbError',{detail:field.id});
 for(const form of DB.forms)for(const[kind,bars]of form.sections)if(!DB.sectionTypes[kind]||bars<E.limits.minPattern||!Number.isInteger(bars))throw error('dbError',{detail:form.id});
 for(const mode of DB.modes){
  const chords=[...mode.chords,...mode.borrowed,...mode.applied];
  if(new Set(chords.map(chord=>chord.id)).size!==chords.length)throw error('dbError',{detail:mode.id});
  for(const chord of chords)if(!DB.qualities[chord.quality]||!DB.functions[chord.fn]||(chord.target&&!chords.some(item=>item.id===chord.target)))throw error('dbError',{detail:chord.id});
  for(const progression of DB.progressions)if(progression.modes&&(!progression.modes[mode.id]||progression.modes[mode.id].some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
 }
 for(const role of E.arrangement.roles)if(!DB.instruments.some(item=>item.role===role))throw error('dbError',{detail:role});
 return true;
}

function formatDuration(seconds){return fmt(U.minuteFormat,{minutes:Math.floor(seconds/E.numeric.secondsPerMinute),seconds:String(seconds%E.numeric.secondsPerMinute).padStart(E.numeric.padding,'0')});}
function eventRange(section,event){const start=section.start+event.bar,end=start+event.duration;return event.duration>=E.numeric.unit?`${start}${event.duration>E.numeric.unit?U.rangeSeparator+(end-E.numeric.unit):''}`:`${start}${U.rangeSeparator}${end}`;}
function toMarkdown(guide){
 const rows=guide.sections.map(section=>{
  const table=section.events.map(event=>`| ${eventRange(section,event)} | ${event.symbol} | ${event.id} | ${event.bassName} | ${event.voicing} | ${DB.sources[event.source]} |`).join('\n');
  return`### ${section.label} (${section.start}${U.rangeSeparator}${section.end} ${U.bars})\n\n${fmt(U.phraseHint,section)}\n\n| ${U.barRange} | ${U.chord} | ${U.roman} | ${U.bass} | ${U.voicing} | ${U.source} |\n| --- | --- | --- | --- | --- | --- |\n${table}\n\n- ${U.arrangement}: ${section.arrangement.instruments.map(item=>item.label).join(U.listSeparator)}\n- ${U.rhythm}: ${section.rhythm}\n- ${U.melody}: ${section.melody}\n- ${U.transition}: ${section.transition}`;
 });
 return`# ${U.exportTitle}\n\n${guide.summary.title}\n\n${guide.summary.subtitle} · ${guide.config.bpm} ${U.bpm} · ${guide.bars} ${U.bars} · ${formatDuration(guide.seconds)}\n\n${fmt(U.seedTag,{seed:guide.config.seed})} · ${fmt(U.versionTag,{version:guide.version})}\n\n## ${U.exportConfig}\n\n${DB.fields.filter(field=>field.id!=='customProgression'||guide.config.progression==='custom').map(field=>`- ${field.label}: ${field.type==='select'?byId(field.table,guide.config[field.id]).label:guide.config[field.id]}`).join('\n')}\n\n## ${U.exportHarmony}\n\n${guide.harmony.map(item=>`**${item.title}**: ${item.body}`).join('\n\n')}\n\n${guide.summary.notice}\n\n## ${U.exportMelody}\n\n${guide.melody.map(item=>`**${item.title}**: ${item.body}`).join('\n\n')}\n\n## ${U.exportSections}\n\n${rows.join('\n\n')}\n\n## ${U.exportDaw}\n\n${guide.daw.map((step,index)=>`${index+E.numeric.unit}. ${step}`).join('\n')}\n\n## ${U.exportMethod}\n\n${U.methodDescription}\n\n${Object.entries(guide.diagnostics).map(([key,value])=>`- ${U[key]}: ${value}`).join('\n')}\n\n${U.footnote}\n\n${DB.theoryReferences.map(source=>`[${source.label}](${source.url})`).join('\n')}`;
}

function buildControls(){
 const fieldHtml=field=>{
  const id=`field-${field.id}`,label=`<span class="field-label">${escapeHtml(field.label)}</span>`,help=field.help?`<small class="field-help" id="help-${field.id}">${escapeHtml(field.help)}</small>`:'',description=field.help?` aria-describedby="help-${field.id}"`:'';
  if(field.type==='select')return`<label class="field" for="${id}">${label}<select id="${id}" name="${field.id}"${description}>${DB[field.table].map(option=>`<option value="${escapeHtml(option.id)}">${escapeHtml(option.label)}</option>`).join('')}</select>${help}</label>`;
  if(field.type==='range')return`<div class="range-field"><div class="range-head"><label for="${id}">${escapeHtml(field.label)}</label><output for="${id}" id="output-${field.id}"></output></div><input type="range" id="${id}" name="${field.id}" min="${field.min}" max="${field.max}" step="${field.increment}"${description}>${help}<div class="range-ends"><span>${escapeHtml(field.ends[0])}</span><span>${escapeHtml(field.ends[1])}</span></div></div>`;
  return`<label class="field" for="${id}" id="wrap-${field.id}">${label}<input type="${field.type}" id="${id}" name="${field.id}"${field.type==='number'?` min="${field.min}" max="${field.max}" step="${field.increment}"`:` maxlength="${field.maxLength}"`}${field.placeholder?` placeholder="${escapeHtml(field.placeholder)}"`:''}${description} required>${help}</label>`;
 };
 const groupHtml=step=>{
  const fields=DB.fields.filter(field=>field.step===step),rendered=new Set();
  return fields.map(field=>{
   if(rendered.has(field.id))return'';
   if(field.pair){const pair=fields.filter(item=>item.pair===field.pair);pair.forEach(item=>rendered.add(item.id));return`<div class="pair">${pair.map(fieldHtml).join('')}</div>`;}
   return fieldHtml(field);
  }).join('');
 };
 document.getElementById('controls').innerHTML=`<div class="field-label">${escapeHtml(U.presets)}</div><div class="preset-row">${DB.presets.map(preset=>`<button class="preset" type="button" data-preset="${escapeHtml(preset.id)}">${escapeHtml(preset.label)}</button>`).join('')}</div>${U.steps.map((step,index)=>`<div class="step"><span>${String(index+E.numeric.unit).padStart(E.numeric.padding,'0')}</span>${escapeHtml(step)}</div>${groupHtml(index)}`).join('')}<details class="advanced"><summary>${escapeHtml(U.advanced)}</summary>${groupHtml('advanced')}</details>`;
}

} · ${escapeHtml(U.octaveHint)}</p></div></details>`).join('');

l"><div class="panel-top"><h3>${escapeHtml(U.melodyTitle)}</h3></div>${list(guide.melody)}</section></div><div class="report-header"><h2>${escapeHtml(U.sectionsTitle)}</h2></div>${sections}<section class="panel"><div class="panel-top"><h3>${escapeHtml(U.dawTitle)}</h3></div><ol class="checklist">${guide.daw.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol><p class="trace">${escapeHtml(guide.summary.orchestral)}</p></section><details class="engine-details"><summary>${escapeHtml(U.methodTitle)}</summary><p class="trace">${escapeHtml(U.methodDescription)}</p><div class="engine-grid">${diagnostic}</div><div class="sources"><span>${escapeHtml(U.sourcesTitle)} · </span>${DB.theoryReferences.map(source=>`<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a>`).join('')}</div></details><p class="footnote">${escapeHtml(U.footnote)}</p>`;
}

function setStatus(message,isError=false){const status=document.getElementById('status');status.textContent=message;status.dataset.error=String(isError);}
let currentGuide=null,busy=false,printState=[];
async function runGeneration(message=null){
 if(busy)return;
 busy=true;
 const button=document.getElementById('generate'),report=document.getElementById('report');
 button.disabled=true;report.setAttribute('aria-busy','true');setStatus(U.generating);
 await new Promise(resolve=>setTimeout(resolve,E.timing.renderYield));
 try{
  const guide=generateGuide(readConfig());currentGuide=guide;writeConfig(guide.config);renderGuide(guide);report.classList.remove('pending');
  try{localStorage.setItem(DB.storage.key,JSON.stringify(guide.config));}catch{}
  setStatus(message??fmt(U.ready,{seed:guide.config.seed}));
 }catch(reason){setStatus(reason instanceof Error?reason.message:U.genericError,true);}
 finally{busy=false;button.disabled=false;report.setAttribute('aria-busy','false');}
}

function downloadGuide(kind){
 const json=kind==='json',data=json?JSON.stringify(currentGuide,null,E.numeric.padding):toMarkdown(currentGuide);
 const url=URL.createObjectURL(new Blob([data],{type:json?E.export.jsonMime:E.export.markdownMime}));
 const link=document.createElement('a');link.href=url;link.download=U.exportFile+(json?E.export.jsonExtension:E.export.markdownExtension);document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),E.export.revokeDelay);setStatus(U.exported);
}

function init(){
 try{validateDatabase();}catch(reason){setStatus(reason.message,true);return;}
 document.title=U.title;document.querySelector('meta[name=description]').content=U.description;
 document.querySelectorAll('[data-text]').forEach(element=>element.textContent=U[element.dataset.text]);
 buildControls();
 let config={...DB.defaults},restored=false;
 try{const saved=JSON.parse(localStorage.getItem(DB.storage.key));if(saved&&typeof saved==='object'){config=normalizeConfig(saved);restored=true;}}catch{}
 writeConfig(config);
 document.getElementById('composer-form').addEventListener('submit',event=>{event.preventDefault();runGeneration();});
 document.getElementById('composer-form').addEventListener('input',()=>{refreshFields();document.getElementById('report').classList.add('pending');setStatus(U.changed);});
 document.getElementById('reset').addEventListener('click',()=>{writeConfig({...DB.defaults});runGeneration();});
 document.getElementById('controls').addEventListener('click',event=>{const button=event.target.closest('[data-preset]');if(button){writeConfig({...readConfig(),...DB.presets.find(preset=>preset.id===button.dataset.preset).values});runGeneration();}});
 document.getElementById('report').addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button||!currentGuide)return;
  const action=button.dataset.action;
  if(action==='copy'){try{await navigator.clipboard.writeText(toMarkdown(currentGuide));setStatus(U.copied);}catch{downloadGuide('markdown');setStatus(U.copyFailed);}}
  else if(action==='print')window.print();else downloadGuide(action);
 });
 window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('.section')].map(element=>({element,open:element.open}));printState.forEach(({element})=>element.open=true);});
 window.addEventListener('afterprint',()=>printState.forEach(({element,open})=>element.open=open));
 runGeneration(restored?U.restored:U.sample);
}
if(typeof document!=='undefined')init();
</script></body></html>
