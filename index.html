function validateDatabase(){
 const sourceIds=new Set(K.sources.map(source=>source.id));
 for(const rule of K.rules)if(!rule.refs.length||rule.refs.some(id=>!sourceIds.has(id)))throw error('dbError',{detail:rule.id});
 for(const item of DB.instruments)if(!DB.instrumentProfiles[item.id])throw error('dbError',{detail:item.id});
 for(const table of['artistStyles','drumUses','bridgeTypes','tonalPlans','bassStyles','fields','genres','moods','styles','meters','keys','modes','forms','progressions','instruments','vocalRanges','subgenres']){
  const ids=DB[table].map(entry=>entry.id);if(new Set(ids).size!==ids.length)throw error('dbError',{detail:table});
 }
 for(const field of DB.fields)if(field.type==='select'&&!byId(field.table,DB.defaults[field.id]))throw error('dbError',{detail:field.id});
 for(const genre of DB.genres)if(DB.subgenres.filter(item=>item.parent===genre.id&&item.default).length!==E.numeric.unit)throw error('dbError',{detail:genre.id});
 for(const child of DB.subgenres){
  if(!byId('genres',child.parent)||!Object.keys(child.sourceMix).length||Object.entries(child.sourceMix).some(([id,weight])=>!byId('genres',id)||!Number.isFinite(weight)||weight<=0))throw error('dbError',{detail:child.id});
  if(child.bpm.length!==E.numeric.padding||child.bpm[0]>child.bpm.at(-1))throw error('dbError',{detail:child.id});
  for(const id of Object.keys(child.instruments??{}))if(!byId('instruments',id))throw error('dbError',{detail:id});
  for(const id of Object.keys(child.kitWeights??{}))if(!P.drumKits.some(kit=>kit.id===id))throw error('dbError',{detail:id});
  for(const kind of Object.keys(child.sections??{}))if(!DB.sectionTypes[kind])throw error('dbError',{detail:kind});
 }
 normalizeSongform(DB.defaults.customForm);
 for(const form of DB.forms.filter(form=>!form.builder))for(const[kind,bars]of form.sections)if(!DB.sectionTypes[kind]||bars<E.limits.minPattern||!Number.isInteger(bars))throw error('dbError',{detail:form.id});
 for(const mode of DB.modes){
  const chords=[...mode.chords,...mode.borrowed,...mode.applied];
  if(new Set(chords.map(chord=>chord.id)).size!==chords.length)throw error('dbError',{detail:mode.id});
  for(const chord of chords)if(!DB.qualities[chord.quality]||!DB.functions[chord.fn]||(chord.target&&!chords.some(item=>item.id===chord.target)))throw error('dbError',{detail:chord.id});
  for(const progression of DB.progressions)if(progression.grammar){
   const grammar=DB.progressionGrammars[progression.grammar];
   if(!grammar||grammar.slots[mode.id]?.length!==grammar.referenceBars||grammar.slots[mode.id].some(slot=>!slot.length||slot.some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
  }
  for(const progression of DB.progressions)if(progression.modes&&(!progression.modes[mode.id]||progression.modes[mode.id].some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
  for(const progression of DB.progressions)if(progression.weights&&(progression.weights.length!==progression.modes[mode.id].length||progression.weights.some(weight=>!Number.isFinite(weight)||weight<=0)))throw error('dbError',{detail:progression.id});
 }
 for(const role of E.arrangement.roles)if(!DB.instruments.some(item=>item.role===role))throw error('dbError',{detail:role});
 for(const meter of DB.meters)if(!P.meters[meter.id]||P.meters[meter.id].barTicks!==meter.quarters*P.ticksPerQuarter)throw error('dbError',{detail:meter.id});
 for(const kit of P.drumKits)for(const voice of[kit.kick,kit.snare,kit.time,...kit.fill])if(!P.drumVoices[voice])throw error('dbError',{detail:voice});
 for(const range of DB.vocalRanges)if(range.lower>=range.upper||range.center<range.lower||range.center>range.upper)throw error('dbError',{detail:range.id});
 for(const artist of DB.artistStyles.filter(item=>item.id!=='none')){
  if(artist.sources.length<E.numeric.padding||!DB.ensemble.profiles[artist.family]||artist.meters.some(id=>!byId('meters',id)))throw error('dbError',{detail:artist.id});
  for(const mode of DB.modes){const chords=[...mode.chords,...mode.borrowed,...mode.applied];for(const rows of Object.values(artist.schemas[mode.id]))for(const row of rows)if(row.split(',').some(id=>!chords.some(chord=>chord.id===id)))throw error('dbError',{detail:artist.id});}
 }
 return true;
}

function playbackTracks(section){
 return section.orchestration.tracks.map(track=>({...track,trackId:track.id+':'+track.role,label:track.label+U.noteSeparator+IU.roles[track.role],part:DB.playback.roleParts[track.role]})).filter(track=>track.part&&track.events.some(event=>event.role!=='rest'));

function createPlaybackEvents(section,mode='all'){
 const rule=DB.playback,part=section.parts,phraseSeconds=part.bars*part.barTicks*section.performance.msPerTick/K.performance.milliseconds,events=[];
 for(const track of playbackTracks(section)){
  const id=track.part;if(mode!=='all'&&mode!==id)continue;
  if(id!=='chords'&&part[id].enabled===false)continue;
  for(let cycle=0;cycle<section.repeats;cycle++)for(const event of track.events){
   if(event.role==='rest')continue;
   const pitches=(event.pitches??(Number.isFinite(event.pitch)?[event.pitch]:[])).filter(Number.isFinite);
   if(!pitches.length&&id!=='drums'&&event.role!=='ghost')continue;
   const start=(event.performance?.startMs??event.start*section.performance.msPerTick)/K.performance.milliseconds+cycle*phraseSeconds;
   const end=(event.performance?.releaseMs??(event.start+event.duration)*section.performance.msPerTick)/K.performance.milliseconds+cycle*phraseSeconds;
   events.push({part:id,track:track.trackId,start,duration:Math.max(rule.minimumDuration,end-start),pitches,velocity:event.velocity??K.performance.velocityWeak,voice:event.voice??null,ghost:event.role==='ghost'});
  }
 }
 return{events:events.sort((a,b)=>a.start-b.start),duration:phraseSeconds*section.repeats,barSeconds:part.barTicks*section.performance.msPerTick/K.performance.milliseconds};
}

function setPlaybackMix(action,trackId){
 if(!currentGuide)return;
 const section=currentGuide.sections[resultState.section],tracks=playbackTracks(section);
 if(['toggle','solo'].includes(action)&&!tracks.some(track=>track.trackId===trackId))return;
 for(const track of tracks){
  if(action==='all-on'||action==='solo'&&track.trackId===trackId)guidePlayer.muted.delete(track.trackId);
  else if(action==='all-off'||action==='solo')guidePlayer.muted.add(track.trackId);
 }
 if(action==='toggle'){if(guidePlayer.muted.has(trackId))guidePlayer.muted.delete(trackId);else guidePlayer.muted.add(trackId);}
 for(const[id,bus]of guidePlayer.trackBuses)bus.gain.setValueAtTime(guidePlayer.muted.has(id)?0:E.numeric.unit,guidePlayer.context.currentTime);

}
function refreshPlaybackUI(){

 const active=guidePlayer.playing,status=document.getElementById('playback-status');
 const elapsed=active?Math.max(0,guidePlayer.context.currentTime-guidePlayer.start):0,bar=active?Math.min(guidePlayer.section.bars,Math.floor(elapsed/guidePlayer.barSeconds)+E.numeric.unit):0;
 if(status)status.textContent=active?fmt(DB.playback.ui.playing,{part:guidePlayer.mode==='all'?DB.playback.ui.all:guidePlayer.mode==='topline'?guidePlayer.section.parts.topline.leadLabel:DB.resultUI.tabs.find(tab=>tab.id===guidePlayer.mode).label,bar,bars:guidePlayer.section.bars}):DB.playback.ui.ready;

function stopPlayback(refresh=true){

 if(guidePlayer.timer!==null)clearInterval(guidePlayer.timer);if(guidePlayer.displayTimer!==null)clearInterval(guidePlayer.displayTimer);

 for(const source of guidePlayer.sources){try{source.stop();source.disconnect();}catch{}}
 guidePlayer.sources.clear();for(const bus of guidePlayer.trackBuses.values())bus.disconnect();guidePlayer.trackBuses.clear();if(guidePlayer.bus){guidePlayer.bus.disconnect();guidePlayer.bus=null;}

function prepareAudio(){
 const rule=DB.playback;if(guidePlayer.context)return guidePlayer.context;
 const Audio=window.AudioContext??window.webkitAudioContext;if(!Audio)throw new Error(rule.ui.unsupported);
 const context=new Audio(),compressor=context.createDynamicsCompressor(),master=context.createGain();
 for(const[id,value]of Object.entries(rule.compressor))compressor[id].value=value;
 master.gain.value=rule.masterGain;master.connect(compressor);compressor.connect(context.destination);
 const noise=context.createBuffer(E.numeric.unit,Math.ceil(context.sampleRate*rule.noise.seconds),context.sampleRate),samples=noise.getChannelData(0),random=seededRandom(rule.noise.seed);
 for(let index=0;index<samples.length;index++)samples[index]=random()*rule.noise.range-rule.noise.center;

}
function registerAudioSource(source,nodes){

}
function noteEnvelope(gain,start,duration,peak,spec){
 const floor=DB.playback.minimumGain,attack=Math.min(spec.attack,duration/E.numeric.padding),decay=Math.min(spec.decay,duration-attack),end=start+duration;

}
function playPitchedEvent(event,at){
 const context=guidePlayer.context,spec=DB.playback.instruments[event.part],velocity=event.velocity/K.midi.velocityMax;
 for(const pitch of event.pitches)for(const[multiple,weight]of spec.harmonics){
  const source=context.createOscillator(),filter=context.createBiquadFilter(),gain=context.createGain();
  source.type=spec.wave;source.frequency.setValueAtTime(midiFrequency(pitch)*multiple,at);filter.type='lowpass';filter.frequency.value=spec.filter;
  noteEnvelope(gain.gain,at,event.duration,spec.gain*velocity*weight/Math.sqrt(event.pitches.length),spec);
  source.connect(filter);filter.connect(gain);gain.connect(guidePlayer.trackBuses.get(event.track)??guidePlayer.bus);registerAudioSource(source,[filter,gain]);source.start(at);source.stop(at+event.duration+spec.release);
 }

function playPercussiveEvent(event,at){
 const rule=DB.playback,context=guidePlayer.context,spec=rule.drums[event.ghost?'ghost':rule.drumFamilies[event.voice]??'hat'],velocity=event.velocity/K.midi.velocityMax;
 const envelope=(gain,peak)=>{gain.setValueAtTime(rule.minimumGain,at);gain.linearRampToValueAtTime(Math.max(rule.minimumGain,peak*velocity),at+spec.attack);gain.exponentialRampToValueAtTime(rule.minimumGain,at+spec.decay);};
 if(spec.frequency){
  const source=context.createOscillator(),gain=context.createGain();source.type=spec.wave;source.frequency.setValueAtTime(spec.frequency,at);
  if(spec.endFrequency)source.frequency.exponentialRampToValueAtTime(spec.endFrequency,at+spec.sweep);
  envelope(gain.gain,spec.gain);source.connect(gain);gain.connect(guidePlayer.trackBuses.get(event.track)??guidePlayer.bus);registerAudioSource(source,[gain]);source.start(at);source.stop(at+spec.decay);

  const source=context.createBufferSource(),filter=context.createBiquadFilter(),gain=context.createGain();source.buffer=guidePlayer.noise;filter.type=spec.noiseType;filter.frequency.value=spec.noiseFilter;

}
async function startPlayback(mode){
 if(!currentGuide||!['all',...DB.playback.parts].includes(mode))return;
 stopPlayback();const token=guidePlayer.token,section=currentGuide.sections[resultState.section],schedule=createPlaybackEvents(section,mode);
 const status=document.getElementById('playback-status');if(!schedule.events.length){if(status)status.textContent=DB.playback.ui.silent;return;}
 try{
  const context=prepareAudio();await context.resume();if(token!==guidePlayer.token)return;
  const bus=context.createGain();bus.connect(guidePlayer.master);
  for(const track of playbackTracks(section)){const channel=context.createGain();channel.gain.setValueAtTime(guidePlayer.muted.has(track.trackId)?0:E.numeric.unit,context.currentTime);channel.connect(bus);guidePlayer.trackBuses.set(track.trackId,channel);}
  Object.assign(guidePlayer,{bus,section,mode,playing:true,start:context.currentTime+DB.playback.startDelay,end:context.currentTime+DB.playback.startDelay+schedule.duration+DB.playback.tail,barSeconds:schedule.barSeconds});
  let cursor=0;
  const tick=()=>{
   if(!guidePlayer.playing||token!==guidePlayer.token)return;
   const horizon=context.currentTime+DB.playback.lookahead;
   while(cursor<schedule.events.length&&guidePlayer.start+schedule.events[cursor].start<=horizon){const original=schedule.events[cursor++],intended=guidePlayer.start+original.start,lateness=Math.max(0,context.currentTime-intended);if(lateness>=original.duration)continue;const event={...original,duration:original.duration-lateness},at=Math.max(context.currentTime,intended);if(event.part==='drums'||event.ghost)playPercussiveEvent(event,at);else playPitchedEvent(event,at);}
   if(context.currentTime>=guidePlayer.end)stopPlayback();

  tick();guidePlayer.timer=setInterval(tick,DB.playback.intervalMs);guidePlayer.displayTimer=setInterval(refreshPlaybackUI,DB.playback.displayMs);refreshPlaybackUI();
 }catch(reason){if(token!==guidePlayer.token)return;stopPlayback();const failedStatus=document.getElementById('playback-status');if(failedStatus)failedStatus.textContent=reason.message===DB.playback.ui.unsupported?reason.message:DB.playback.ui.error;}
}

 const rows=section.orchestration.tracks.map(track=>`<tr><td>${escapeHtml(track.label)}</td><td>${escapeHtml(IU.roles[track.role])}</td><td class="mono">${escapeHtml(track.range?pitchName(track.range.low,DB.keys[0],true)+U.rangeSeparator+pitchName(track.range.high,DB.keys[0],true):DB.partPolicy.silent)}</td><td>${escapeHtml(IU.articulations[track.articulation]??track.articulation)}</td></tr>`).join('');
 const counter=section.orchestration.counter;
 const response=counter.enabled?`<p>${escapeHtml(counter.label)} · ${escapeHtml(IU.concert)}</p><div class="table-wrap"><table><thead><tr>${[IU.notes,DB.resultUI.start,DB.resultUI.length].map(label=>`<th>${escapeHtml(label)}</th>`).join('')}</tr></thead><tbody>${counter.notes.map(event=>{const timing=noteTiming(event,section.parts);return`<tr><td class="mono">${escapeHtml(event.note)}</td><td>${escapeHtml(fmt(DB.resultUI.barTitle,{bar:Math.floor(event.start/section.parts.barTicks)+E.numeric.unit}))} · ${escapeHtml(timing.start)}</td><td>${escapeHtml(timing.length)}</td></tr>`;}).join('')}</tbody></table></div>`:`<p>${escapeHtml(IU.counterEmpty)}</p>`;
 const instrumentNotes=section.orchestration.tracks.filter(track=>['harmony','texture'].includes(track.role)).map(track=>`<details class="input-details"><summary>${escapeHtml(track.label+' · '+IU.notes)}</summary><div class="table-wrap"><table><thead><tr>${[U.bars,IU.notes,IU.articulation].map(label=>`<th>${escapeHtml(label)}</th>`).join('')}</tr></thead><tbody>${track.events.filter(event=>event.notes).map(event=>`<tr><td>${event.start/section.parts.barTicks+E.numeric.unit}</td><td class="mono">${escapeHtml(event.notes.join(U.listSeparator))}${event.fingering?`<small class="carry">${escapeHtml(event.fingering.map(note=>fmt(PU.fingering,note)).join(U.listSeparator))}</small>`:''}</td><td>${escapeHtml(IU.articulations[event.articulation]??event.articulation)}</td></tr>`).join('')}</tbody></table></div></details>`).join('');
 const performance=Object.entries(section.performance.parts).filter(([id])=>section.parts[id]&&section.parts[id].enabled!==false).map(([id,value])=>`<p>${escapeHtml(fmt(IU.offset,{part:DB.resultUI.tabs.find(tab=>tab.id===id)?.label??id,offset:value.maximumOffset}))}</p>`).join('');
 const dawRows=section.dawTracks.tracks.map(track=>`<tr><td>${escapeHtml(track.label)}</td><td>${track.channel}</td><td>${track.program??DB.partPolicy.silent}</td><td>${escapeHtml(track.articulations.map(id=>DB.bassPerformance.techniques[id]?.label??IU.articulations[id]??id).join(U.listSeparator))}</td></tr>`).join('');
 return`<details class="input-details"><summary>${escapeHtml(IU.title)}</summary><p>${escapeHtml(fmt(IU.storyBody,{contour:section.parts.topline.theme.contour.join(U.listSeparator),transform:PU.transforms[section.interaction.transform]??section.interaction.transform,bridge:section.interaction.bridge}))}</p><h3>${escapeHtml(IU.orchestration)}</h3><div class="table-wrap"><table><thead><tr>${[IU.instrument,IU.role,IU.register,IU.articulation].map(label=>`<th>${escapeHtml(label)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${instrumentNotes}<h3>${escapeHtml(IU.counter)}</h3>${response}<h3>${escapeHtml(IU.timing)}</h3>${performance}<h3>${escapeHtml(IU.mix)}</h3>${section.acoustics.ranges.map(range=>`<p>${escapeHtml(range.label)} · ${escapeHtml(fmt(IU.frequency,{low:range.lowHz,high:range.highHz}))}</p>`).join('')}${section.acoustics.risks.map(risk=>`<p>${escapeHtml(risk.advice)}</p>`).join('')}<p>${escapeHtml(IU.mixHelp)}</p><h3>${escapeHtml(IU.daw)}</h3><div class="table-wrap"><table><thead><tr>${[IU.instrument,IU.channel,IU.program,IU.articulation].map(label=>`<th>${escapeHtml(label)}</th>`).join('')}</tr></thead><tbody>${dawRows}</tbody></table></div><p>${escapeHtml(IU.midiHelp)}</p>${section.parts.drums.adaptation?`<p>${escapeHtml(section.parts.drums.adaptation)}</p>`:''}<p>${escapeHtml(IU.drumMap)} · ${escapeHtml(section.dawTracks.drums.map(voice=>voice.label+' '+voice.midi).join(U.listSeparator))}</p><p>${escapeHtml(fmt(IU.candidate,{count:section.interaction.validCandidates}))} · ${escapeHtml(IU.passed)}</p></details>`;
}
function interactionMarkdown(section){
 if(!section.orchestration)return'';
 const lines=section.orchestration.tracks.map(track=>`- ${track.label}: ${IU.roles[track.role]} · ${IU.articulations[track.articulation]??track.articulation}`);
 const notes=section.orchestration.tracks.filter(track=>['harmony','texture'].includes(track.role)).flatMap(track=>track.events.filter(event=>event.notes).map(event=>`- ${track.label} · ${event.start/section.parts.barTicks+E.numeric.unit}${U.bars}: ${event.notes.join(U.listSeparator)}${event.fingering?U.noteSeparator+event.fingering.map(note=>fmt(PU.fingering,note)).join(U.listSeparator):''}`));
 const counter=section.orchestration.counter.notes.map(event=>{const timing=noteTiming(event,section.parts);return`- ${section.orchestration.counter.label} · ${Math.floor(event.start/section.parts.barTicks)+E.numeric.unit}${U.bars}: ${event.note} · ${timing.start} · ${timing.length}`;});
 const performance=Object.entries(section.performance.parts).map(([part,values])=>`- ${fmt(IU.offset,{part:DB.resultUI.tabs.find(tab=>tab.id===part)?.label??section.orchestration.tracks.find(track=>track.id+':'+track.role===part)?.label??part,offset:values.maximumOffset})}`);
 const frequencies=section.acoustics.ranges.map(range=>`- ${range.label}: ${fmt(IU.frequency,{low:range.lowHz,high:range.highHz})}`);
 const tracks=section.dawTracks.tracks.map(track=>`- ${track.label}: ${IU.channel} ${track.channel} · ${IU.program} ${track.program??DB.partPolicy.silent}`);
 return`\n\n#### ${IU.title}\n\n${lines.join('\n')}\n\n${notes.join('\n')}\n\n${counter.join('\n')}\n\n${performance.join('\n')}\n\n${frequencies.join('\n')}\n\n${IU.mixHelp}\n\n${section.acoustics.risks.map(risk=>'- '+risk.advice).join('\n')}\n\n${tracks.join('\n')}\n\n${IU.midiHelp}`;
}

function artistStyleHtml(artist){
 if(!artist)return'';
 const ui=DB.artistStyleRules;
 return `<details class="input-details reference"><summary>${escapeHtml(fmt(ui.heading,{artist:artist.label}))}</summary><p>${escapeHtml(artist.description)}</p>${Object.entries(ui.featureLabels).map(([key,label])=>`<p><strong>${escapeHtml(label)}</strong> · ${escapeHtml(artist.features[key])}</p>`).join('')}<p class="trace">${escapeHtml(ui.method)}</p><strong>${escapeHtml(ui.sources)}</strong><div class="sources">${artist.sources.map(source=>`<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a><p>${escapeHtml(source.evidence)}${source.companionUrl?` <a href="${escapeHtml(source.companionUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(ui.sources)}</a>`:''}</p>`).join('')}</div></details>`;
}
function artistStyleMarkdown(artist){
 if(!artist)return'';
 const ui=DB.artistStyleRules;
 return '\n\n## '+fmt(ui.heading,{artist:artist.label})+'\n\n'+artist.description+'\n\n'+Object.entries(ui.featureLabels).map(([key,label])=>'- '+label+': '+artist.features[key]).join('\n')+'\n\n'+ui.method+'\n\n'+artist.sources.map(source=>'['+source.label+']('+source.url+') · '+source.evidence).join('\n');
}
function renderGuide(guide,reset=true){
 const ui=DB.resultUI;
 if(reset)resultState={section:Math.max(0,guide.sections.findIndex(section=>section.kind===ui.startKind)),part:ui.tabs[0].id,bar:0,showVoicings:resultState.showVoicings,chord:0};
 const list=items=>`<ul class="guidance-list">${items.map(item=>`<li><strong>${escapeHtml(item.title)}</strong><p>${escapeHtml(item.body)}</p></li>`).join('')}</ul>`;
 const diagnostic=Object.entries(guide.diagnostics).map(([key,value])=>`<div><strong>${value}${['borrowed','applied','extension','swing'].includes(key)?U.percentage:''}</strong><small>${escapeHtml(U[key])}</small></div>`).join('');
 const steps=ui.steps.map((step,index)=>`<a class="result-step" href="#${step.target}"><span>${index+E.numeric.unit}</span><div><strong>${escapeHtml(step.title)}</strong><small>${escapeHtml(step.body)}</small></div></a>`).join('');
 const sections=guide.sections.map(section=>resultButton('section',section.index,`<span class="form-energy" style="height:${E.display.diagramBase*E.numeric.percent+section.energy*E.display.diagramEnergy}%"></span><strong>${escapeHtml(section.label)}</strong><small>${escapeHtml(fmt(ui.range,section))}</small>`,`class="form-block" style="--section:var(--${ui.sectionColors[section.kind]})" aria-current="${section.index===resultState.section}"`)).join('');
 const reference=guide.progressionPlan?`<details class="input-details reference"><summary>${escapeHtml(guide.progressionPlan.title)}</summary>${renderChordCards(guide.progressionPlan.events)}<p class="timing-help">${escapeHtml(ui.referenceHelp)}</p></details>`:'';
 document.getElementById('report').innerHTML=`<section class="brief"><div><div class="eyebrow">${escapeHtml(U.briefEyebrow)}</div><h2>${escapeHtml(guide.summary.title)}</h2><small>${escapeHtml(guide.summary.subtitle)}</small><small>${escapeHtml(guide.summary.subgenre)}</small></div><div class="brief-stats"><div class="stat"><strong class="mono">${guide.config.bpm}</strong><span>${escapeHtml(U.bpm)}</span></div><div class="stat"><strong class="mono">${guide.bars}</strong><span>${escapeHtml(U.bars)}</span></div><div class="stat"><strong class="mono">${formatDuration(guide.seconds)}</strong><span>${escapeHtml(U.duration)}</span></div></div></section><nav class="result-steps" aria-label="${escapeHtml(ui.title)}">${steps}</nav><div class="report-header"><h2>${escapeHtml(U.reportTitle)}</h2><div class="actions">${['copy','markdown','json','print'].map(action=>`<button type="button" data-action="${action}">${escapeHtml(U[action])}</button>`).join('')}</div></div><section class="panel structure-panel" id="result-structure"><div class="panel-top"><h3>${escapeHtml(U.energyTitle)}</h3><small>${escapeHtml(U.energyHint)}</small></div><nav class="form-map" aria-label="${escapeHtml(ui.sectionLabel)}">${sections}</nav><p class="timing-help">${escapeHtml(fmt(ui.total,{count:guide.sections.length,bars:guide.bars}))}</p></section>${renderSectionWorkspace(guide)}${artistStyleHtml(guide.artistStyle)}${reference}<section class="panel daw-panel" id="result-daw"><div class="panel-top"><h3>${escapeHtml(U.dawTitle)}</h3></div><ol class="checklist">${guide.daw.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol></section><details class="engine-details"><summary>${escapeHtml(ui.details)}</summary><div class="overview-grid"><div>${list(guide.harmony)}</div><div>${list(guide.melody)}</div></div></details><details class="engine-details"><summary>${escapeHtml(U.methodTitle)}</summary><p class="trace">${escapeHtml(IU.engine)}</p><p class="trace">${escapeHtml(fmt(IU.asOf,{date:K.asOf,sources:K.sources.length,rules:K.rules.length}))}</p><div class="engine-grid">${diagnostic}</div><div class="sources">${DB.theoryReferences.map(source=>`<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a>`).join('')}</div></details><details class="engine-details"><summary>${escapeHtml(ui.saved)}</summary><div class="tags"><span class="tag accent">${escapeHtml(fmt(U.seedTag,{seed:guide.config.seed}))}</span><span class="tag">${escapeHtml(fmt(U.versionTag,{version:guide.version}))}</span></div><p class="trace">${escapeHtml(DB.seedUI.help)}</p></details>`;
}
function handleResultAction(event){
 const button=event.target.closest('[data-result-action]');if(!button||!currentGuide)return false;
 const action=button.dataset.resultAction,value=button.dataset.resultValue,section=currentGuide.sections[resultState.section];
 if(action==='voicings')resultState.showVoicings=button.checked;
 if(action==='chord'){const index=Number(value);if(!Number.isInteger(index)||!section.phrase[index])return true;resultState.chord=index;resultState.showVoicings=true;}
 if(action==='section'){
  const index=Number(value);if(!Number.isInteger(index)||!currentGuide.sections[index])return true;
  stopPlayback();resultState.section=index;resultState.bar=0;resultState.chord=0;
 }
 if(action==='part'){
  if(!DB.resultUI.tabs.some(tab=>tab.id===value))return true;resultState.part=value;
 }
 if(action==='bar'){
  const bar=Number(value);if(!Number.isInteger(bar)||bar<0||bar>=section.parts.bars)return true;resultState.bar=bar;
 }
 renderGuide(currentGuide,false);
 document.getElementById('report').querySelector(`[data-result-action="${action}"][data-result-value="${value}"]`)?.focus({preventScroll:true});
 return true;
}
function renderPrintableGuide(guide){
 if(!guide)return'';
 return`<h1>${escapeHtml(DB.resultUI.printTitle)}</h1><p>${escapeHtml(guide.summary.title)} · ${guide.config.bpm} ${escapeHtml(U.bpm)} · ${guide.bars} ${escapeHtml(U.bars)}</p>${artistStyleHtml(guide.artistStyle)}${guide.sections.map(section=>`<section class="section"><h2>${escapeHtml(section.label)} · ${escapeHtml(fmt(DB.resultUI.range,section))}</h2><p>${escapeHtml(fmt(U.phraseHint,section))}</p>${renderChordCards(section.phrase)}${renderChordTable(section)}${resultState.showVoicings?section.phrase.map((_,index)=>renderChordVoicing(section,index)).join(''):''}${renderFullPartPlans(section)}<div class="print-interaction"><h3>${escapeHtml(IU.orchestration)}</h3>${section.orchestration?.tracks.filter(track=>['harmony','texture'].includes(track.role)).map(track=>`<p>${escapeHtml(track.label)} · ${escapeHtml(IU.roles[track.role])}</p>${track.events.filter(event=>event.notes||Number.isFinite(event.pitch)).map(event=>`<p>${Math.floor(event.start/section.parts.barTicks)+E.numeric.unit}${escapeHtml(U.bars)} · ${escapeHtml((event.notes??[event.note]).join(U.listSeparator))} · ${escapeHtml(noteTiming(event,section.parts).start)} · ${escapeHtml(noteTiming(event,section.parts).length)}</p>`).join('')}`).join('')??''}</div></section>`).join('')}<h2>${escapeHtml(U.dawTitle)}</h2><ol>${guide.daw.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol>`;
}


function setStatus(message,isError=false){const status=document.getElementById('status');status.textContent=message;status.dataset.error=String(isError);}
let currentGuide=null,busy=false;
async function runGeneration(message=null){
 if(busy)return;
 stopPlayback();busy=true;
 const button=document.getElementById('generate'),report=document.getElementById('report');
 button.disabled=true;report.setAttribute('aria-busy','true');setStatus(U.generating);
 await new Promise(resolve=>setTimeout(resolve,E.timing.renderYield));
 try{
  const guide=generateGuide(readConfig());currentGuide=guide;writeConfig(guide.config);renderGuide(guide);report.classList.remove('pending');
  try{localStorage.setItem(DB.storage.key,JSON.stringify(guide.config));}catch{}
  setStatus(message??fmt(U.ready,{seed:guide.config.seed}));
 }catch(reason){setStatus(reason instanceof Error?reason.message:U.genericError,true);}
 finally{busy=false;button.disabled=false;report.setAttribute('aria-busy','false');}
}

function downloadGuide(kind){
 const json=kind==='json',data=json?JSON.stringify(currentGuide,null,E.numeric.padding):toMarkdown(currentGuide);
 const url=URL.createObjectURL(new Blob([data],{type:json?E.export.jsonMime:E.export.markdownMime}));
 const link=document.createElement('a');link.href=url;link.download=U.exportFile+(json?E.export.jsonExtension:E.export.markdownExtension);document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),E.export.revokeDelay);setStatus(U.exported);
}

function init(){
 try{validateDatabase();}catch(reason){setStatus(reason.message,true);return;}
 for(const[key,value]of Object.entries(DB.visualTheme))document.documentElement.style.setProperty('--'+key,value);
 document.title=U.title;document.querySelector('meta[name=description]').content=U.description;
 document.querySelectorAll('[data-text]').forEach(element=>element.textContent=U[element.dataset.text]);
 buildControls();
 let config={...DB.defaults},restored=false;
 try{const saved=JSON.parse(localStorage.getItem(DB.storage.key));if(saved&&typeof saved==='object'){config=normalizeConfig(saved);restored=true;}}catch{}
 writeConfig(config);
 document.getElementById('composer-form').addEventListener('submit',event=>{event.preventDefault();runGeneration();});
 document.getElementById('composer-form').addEventListener('input',event=>{updateSongformDraft(event);refreshFields();document.getElementById('report').classList.add('pending');setStatus(U.changed);});
 document.getElementById('reset').addEventListener('click',()=>{writeConfig({...DB.defaults});runGeneration();});
 document.getElementById('controls').addEventListener('click',event=>{if(handleSongformAction(event))return;if(event.target.closest('[data-new-seed]')){makeNewSeed();return;}const button=event.target.closest('[data-preset]');if(button){writeConfig({...readConfig(),...DB.presets.find(preset=>preset.id===button.dataset.preset).values});runGeneration();}});
 document.getElementById('report').addEventListener('click',async event=>{
  if(await handlePlaybackAction(event))return;
  if(handleResultAction(event))return;
  const button=event.target.closest('[data-action]');if(!button||!currentGuide)return;
  const action=button.dataset.action;
  if(action==='copy'){try{await navigator.clipboard.writeText(toMarkdown(currentGuide));setStatus(U.copied);}catch{downloadGuide('markdown');setStatus(U.copyFailed);}}
  else if(action==='print')window.print();else downloadGuide(action);
 });
 window.addEventListener('pagehide',()=>stopPlayback(false));
 window.addEventListener('beforeprint',()=>{stopPlayback();document.getElementById('print-report').innerHTML=renderPrintableGuide(currentGuide);});
 window.addEventListener('afterprint',()=>{document.getElementById('print-report').innerHTML='';});
 runGeneration(restored?U.restored:U.sample);
}
if(typeof document!=='undefined')init();
</script></body></html>
