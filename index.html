moods:[{id:'warm',label:'편안한 중음역 · 부드러운 흐름',description:'중음역에서 완만하게 이어지는 선율과 낮은 긴장도. 세부 장르의 리듬 위에 부드러운 연결을 더합니다.',valence:.7,energy:.4,tension:.3,contour:'중음역에서 부드러운 순차 진행을 유지하고 후렴에서만 음역을 넓히세요.'},{id:'bright',label:'밝은 에너지 · 짧은 상행 동기',description:'짧게 올라가는 모티프와 높은 편곡 에너지. BPM을 자동으로 높이지 않으며 같은 템포에서도 리듬의 존재감을 키웁니다.',valence:.95,energy:.8,tension:.35,contour:'짧은 상행 동기를 만들고 프레이즈 끝을 하행하며 안정시키세요.'},{id:'wistful',label:'아련한 여운 · 하행하는 선율',description:'완만한 하행과 늦춘 해결의 느낌. 짧은 응답 뒤에 여백을 두며 선택한 조성을 유지합니다.',valence:.3,energy:.3,tension:.45,contour:'완만한 하행 동기를 반복하고 해결음을 한 박 늦춰 여운을 만드세요.'},{id:'dreamy',label:'떠 있는 느낌 · 긴 음과 쉼',description:'좁은 음역의 긴 음과 짧은 응답, 낮은 에너지와 중간 긴장도. 실제 잔향은 DAW에서 조절하세요.',valence:.5,energy:.2,tension:.55,contour:'음역을 좁게 유지하고 긴 음과 짧은 응답 사이에 공간을 두세요.'},{id:'dark',label:'긴장감 · 좁은 음역의 반복',description:'반복 동기와 높은 화성 긴장도. 비화성음은 해결 규칙을 지키면서 사용합니다.',valence:.12,energy:.55,tension:.8,contour:'좁은 음역의 반복음으로 시작하고 절정 직전에 상행 도약을 한 번 사용하세요.'},{id:'epic',label:'점진적 상승 · 넓어지는 절정',description:'후반에 올라가는 음역과 높은 편곡 에너지. 실제 보컬 음역 제한은 유지합니다.',valence:.65,energy:1,tension:.7,contour:'낮은 음역의 동기를 옥타브로 확장하고 절정에서 가장 높은 음을 사용하세요.'}],
styles:[
 {id:'intimate',label:'가까운 보컬 · 적은 반주',description:'선택 장르의 주 악기로 적은 음을 연주하고 보컬 응답 사이에 여백을 둡니다. 밀도 낮은 피아노·일렉트릭 피아노 방향입니다.',density:.35,swing:.3,orchestra:.3,melody:'긴 음 뒤에 짧은 응답을 두고 악기 사이에 한 박 이상의 여백을 남기세요.',motif:'두 마디 질문과 두 마디 응답을 만들고 응답의 마지막 음만 바꾸세요.',transition:'마지막 박의 악기를 줄이고 다음 구간 첫 박에 중심 악기를 다시 넣으세요.',instrument:{rhodes:.4,piano:.4,vocal:.3}},

 {id:'groovy',label:'약박 강세 · 드럼과 베이스의 맞물림',description:'반주 밀도를 높이고 약박에서 시작하는 프레이징을 더합니다. 킥과 베이스가 같은 위치에서 연결되는 그루브가 중심입니다.',density:.8,swing:.8,orchestra:.25,melody:'약박에 시작하되 프레이즈 끝의 강박에서는 코드톤으로 해결하세요.',motif:'한 마디 리듬 모티프를 반복하고 매 네 번째 마디에 쉼표를 넣으세요.',transition:'리듬 악기 한 파트를 한 마디 먼저 바꾸어 다음 구간을 예고하세요.',instrument:{rhodes:.5,electricBass:.4,drums:.4}},

function selectOptions(field,config){return DB[field.table].filter(option=>!field.parent||option[field.parent.key]===config[field.parent.field]);}
function selectFallback(field,options){return(options.find(option=>option.default)||options.find(option=>option.id===DB.defaults[field.id])||options[0])?.id;}
function normalizeSongform(value){
 let sequence=value;
 if(typeof value==='string'){try{sequence=JSON.parse(value);}catch{throw new Error(fmt(DB.songformUI.invalid,DB.songformRules));}}
 const rules=DB.songformRules;
 if(!Array.isArray(sequence)||sequence.length<rules.minSections||sequence.length>rules.maxSections)throw new Error(fmt(DB.songformUI.invalid,rules));
 for(const row of sequence)if(!Array.isArray(row)||row.length!==E.numeric.padding||!DB.sectionTypes[row[0]]||!Number.isInteger(row[1])||row[1]<rules.minBars||row[1]>rules.maxBars)throw new Error(fmt(DB.songformUI.invalid,rules));

}
function resolveForm(config){const form=byId('forms',config.form);return form.builder?{...form,sections:normalizeSongform(config.customForm)}:form;}
function normalizeConfig(input={}){

 for(const field of DB.fields){
  const value=input[field.id]??DB.defaults[field.id];
  if(field.type==='select'){const options=selectOptions(field,config);config[field.id]=options.some(option=>option.id===value)?value:selectFallback(field,options);}

  }else if(field.type==='songform'){

  }else config[field.id]=String(value).trim().slice(0,field.maxLength);
 }
 if(!new RegExp(E.validation.seedPattern).test(config.seed))throw error('seedError');

}

function seededRandom(seed){

  let value=state;

  value^=value+Math.imul(value^(value>>>E.seed.shiftB),value|E.seed.mix);

function resolveGenre(config){
 const parent=byId('genres',config.genre),subgenre=byId('subgenres',config.subgenre),total=sum(Object.values(subgenre.sourceMix));

  genre[field]=Object.fromEntries([...keys].map(key=>[key,sum(mix.map(source=>(source.genre[field][key]??SG.mapDefaults[field])*source.weight))+(subgenre[field]?.[key]??0)]));
 }
 const preferredHold=subgenre.harmony?.hold??sum(mix.map(source=>source.genre.hold*source.weight));
 genre.hold=SG.holds.toSorted((a,b)=>Math.abs(a-preferredHold)-Math.abs(b-preferredHold))[0];

function voicingCandidates(chord){

}

function validateDatabase(){
 for(const table of['fields','genres','moods','styles','meters','keys','modes','forms','progressions','instruments','vocalRanges','subgenres']){
  const ids=DB[table].map(entry=>entry.id);if(new Set(ids).size!==ids.length)throw error('dbError',{detail:table});
 }
 for(const field of DB.fields)if(field.type==='select'&&!byId(field.table,DB.defaults[field.id]))throw error('dbError',{detail:field.id});
 for(const genre of DB.genres)if(DB.subgenres.filter(item=>item.parent===genre.id&&item.default).length!==E.numeric.unit)throw error('dbError',{detail:genre.id});
 for(const child of DB.subgenres){
  if(!byId('genres',child.parent)||!Object.keys(child.sourceMix).length||Object.entries(child.sourceMix).some(([id,weight])=>!byId('genres',id)||!Number.isFinite(weight)||weight<=0))throw error('dbError',{detail:child.id});
  if(child.bpm.length!==E.numeric.padding||child.bpm[0]>child.bpm.at(-1))throw error('dbError',{detail:child.id});
  for(const id of Object.keys(child.instruments??{}))if(!byId('instruments',id))throw error('dbError',{detail:id});
  for(const id of Object.keys(child.kitWeights??{}))if(!P.drumKits.some(kit=>kit.id===id))throw error('dbError',{detail:id});
  for(const kind of Object.keys(child.sections??{}))if(!DB.sectionTypes[kind])throw error('dbError',{detail:kind});
 }
 normalizeSongform(DB.defaults.customForm);
 for(const form of DB.forms.filter(form=>!form.builder))for(const[kind,bars]of form.sections)if(!DB.sectionTypes[kind]||bars<E.limits.minPattern||!Number.isInteger(bars))throw error('dbError',{detail:form.id});
 for(const mode of DB.modes){
  const chords=[...mode.chords,...mode.borrowed,...mode.applied];
  if(new Set(chords.map(chord=>chord.id)).size!==chords.length)throw error('dbError',{detail:mode.id});
  for(const chord of chords)if(!DB.qualities[chord.quality]||!DB.functions[chord.fn]||(chord.target&&!chords.some(item=>item.id===chord.target)))throw error('dbError',{detail:chord.id});
  for(const progression of DB.progressions)if(progression.grammar){
   const grammar=DB.progressionGrammars[progression.grammar];
   if(!grammar||grammar.slots[mode.id]?.length!==grammar.referenceBars||grammar.slots[mode.id].some(slot=>!slot.length||slot.some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
  }
  for(const progression of DB.progressions)if(progression.modes&&(!progression.modes[mode.id]||progression.modes[mode.id].some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
  for(const progression of DB.progressions)if(progression.weights&&(progression.weights.length!==progression.modes[mode.id].length||progression.weights.some(weight=>!Number.isFinite(weight)||weight<=0)))throw error('dbError',{detail:progression.id});
 }
 for(const role of E.arrangement.roles)if(!DB.instruments.some(item=>item.role===role))throw error('dbError',{detail:role});
 for(const meter of DB.meters)if(!P.meters[meter.id]||P.meters[meter.id].barTicks!==meter.quarters*P.ticksPerQuarter)throw error('dbError',{detail:meter.id});
 for(const kit of P.drumKits)for(const voice of[kit.kick,kit.snare,kit.time,...kit.fill])if(!P.drumVoices[voice])throw error('dbError',{detail:voice});
 for(const range of DB.vocalRanges)if(range.lower>=range.upper||range.center<range.lower||range.center>range.upper)throw error('dbError',{detail:range.id});
 return true;
}

function predictSettings(input){
 const config=normalizeConfig(input),ctx=makeContext(config),form=resolveForm(config),bars=sum(form.sections.map(row=>row[1]));
 const direction=form.sections.map(([kind])=>sectionProfile(ctx,kind)).sort((a,b)=>b.energy-a.energy)[0],energy=clamp(ctx.energy*direction.energy);
 const density=clamp((ctx.style.density*E.density.style+energy*E.density.energy+ctx.complexityTarget*E.density.complexity)*direction.density);
 const arrangement=chooseInstruments(ctx,energy,0,()=>0);
 const seconds=Math.round(bars*ctx.meter.quarters/ctx.meter.pulseQuarters*E.numeric.secondsPerMinute/config.bpm);
 return{config,subgenre:ctx.subgenre.label,section:direction.label,instruments:arrangement.instruments.map(item=>item.label),hold:ctx.hold,density:percent(density),swing:percent(ctx.swing),range:byId('vocalRanges',config.vocalRange).label,description:ctx.mood.description,style:ctx.style.description,count:form.sections.length,bars,duration:formatDuration(seconds)};
}

function progressionHint(input){

function readSongformDraft(){try{const value=JSON.parse(document.getElementById('field-customForm').value);if(Array.isArray(value))return value;}catch{}return DB.defaults.customForm.map(row=>[...row]);}

function updateSongformDraft(event){
 const input=event.target;
 if(input.dataset.formIndex===undefined)return;
 const sequence=readSongformDraft(),index=Number(input.dataset.formIndex);
 if(!sequence[index])return;
 if(input.dataset.formPart==='kind')sequence[index][0]=input.value;
 if(input.dataset.formPart==='bars')sequence[index][1]=Number(input.value);
 document.getElementById('field-customForm').value=JSON.stringify(sequence);

}
function handleSongformAction(event){
 const button=event.target.closest('[data-form-op]');
 if(!button)return false;
 const sequence=readSongformDraft(),index=Number(button.dataset.index),op=button.dataset.formOp,rules=DB.songformRules;
 if(op==='import'){const form=byId('forms',document.getElementById('form-import-source').value);sequence.splice(0,sequence.length,...form.sections.map(row=>[...row]));}
 if(op==='add'&&sequence.length<rules.maxSections)sequence.push([document.getElementById('form-add-type').value,rules.defaultBars]);
 if(op==='duplicate'&&sequence[index]&&sequence.length<rules.maxSections)sequence.splice(index+E.numeric.unit,0,[...sequence[index]]);
 if(op==='remove'&&sequence.length>rules.minSections)sequence.splice(index,E.numeric.unit);
 if(op==='up'&&index>0)[sequence[index-E.numeric.unit],sequence[index]]=[sequence[index],sequence[index-E.numeric.unit]];
 if(op==='down'&&index<sequence.length-E.numeric.unit)[sequence[index+E.numeric.unit],sequence[index]]=[sequence[index],sequence[index+E.numeric.unit]];
 document.getElementById('field-customForm').value=JSON.stringify(sequence);renderSongformEditor();document.getElementById('report').classList.add('pending');setStatus(U.changed);refreshFields();
 return true;
}

mt(U.sectionTrace,section))} · ${escapeHtml(U.octaveHint)}</p></div></details>`).join('');
 document.getElementById('report').innerHTML=`<section class="brief"><div><div class="eyebrow">${escapeHtml(U.briefEyebrow)}</div><h2>${escapeHtml(guide.summary.title)}</h2><small>${escapeHtml(guide.summary.subtitle)}</small><small>${escapeHtml(guide.summary.subgenre)}</small></div><div class="brief-stats"><div class="stat"><strong class="mono">${guide.config.bpm}</strong><span>${escapeHtml(U.bpm)}</span></div><div class="stat"><strong class="mono">${formatDuration(guide.seconds)}</strong><span>${escapeHtml(U.duration)}</span></div><div class="stat"><strong class="mono">${guide.bars}</strong><span>${escapeHtml(U.bars)}</span></div></div></section><div class="report-header"><div><h2>${escapeHtml(U.reportTitle)}</h2><div class="tags"><span class="tag accent">${escapeHtml(fmt(U.seedTag,{seed:guide.config.seed}))}</span><span class="tag">${escapeHtml(fmt(U.versionTag,{version:guide.version}))}</span></div></div><div class="actions">${['copy','markdown','json','print'].map(action=>`<button type="button" data-action="${action}">${escapeHtml(U[action])}</button>`).join('')}</div></div><section class="panel"><div class="panel-top"><h3>${escapeHtml(U.energyTitle)}</h3><small>${escapeHtml(U.energyHint)}</small></div><div class="timeline">${guide.sections.map(section=>`<div class="timeline-cell" style="--bars:${section.bars};--energy:${section.energy};--opacity:${E.display.diagramBase+section.energy/E.numeric.percent*E.display.diagramEnergy}" title="${escapeHtml(fmt(U.sectionSubtitle,section))}"><div class="timeline-bar"></div><div class="timeline-label">${escapeHtml(section.label)}</div><div class="timeline-number">${section.start}${U.rangeSeparator}${section.end}</div></div>`).join('')}</div><p class="timeline-legend">${escapeHtml(fmt(U.energyLegend,{bars:guide.bars,seconds:guide.seconds}))}</p></section><div class="overview-grid"><section class="panel"><div class="panel-top"><h3>${escapeHtml(U.harmonyTitle)}</h3></div>${list(guide.harmony)}<p class="trace">${escapeHtml(guide.summary.notice)}</p></section><section class="panel"><div class="panel-top"><h3>${escapeHtml(U.melodyTitle)}</h3></div>${list(guide.melody)}</section></div><div class="report-header"><h2>${escapeHtml(U.sectionsTitle)}</h2></div>${sections}<section class="panel"><div class="panel-top"><h3>${escapeHtml(U.dawTitle)}</h3></div><ol class="checklist">${guide.daw.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol><p class="trace">${escapeHtml(guide.summary.orchestral)}</p></section><details class="engine-details"><summary>${escapeHtml(U.methodTitle)}</summary><p class="trace">${escapeHtml(PU.method)}</p><div class="engine-grid">${diagnostic}</div><div class="sources"><span>${escapeHtml(U.sourcesTitle)} · </span>${DB.theoryReferences.map(source=>`<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a>`).join('')}</div></details><p class="footnote">${escapeHtml(U.footnote)}</p>`;
}

function setStatus(message,isError=false){const status=document.getElementById('status');status.textContent=message;status.dataset.error=String(isError);}
let currentGuide=null,busy=false,printState=[];
async function runGeneration(message=null){
 if(busy)return;
 busy=true;
 const button=document.getElementById('generate'),report=document.getElementById('report');
 button.disabled=true;report.setAttribute('aria-busy','true');setStatus(U.generating);
 await new Promise(resolve=>setTimeout(resolve,E.timing.renderYield));
 try{
  const guide=generateGuide(readConfig());currentGuide=guide;writeConfig(guide.config);renderGuide(guide);report.classList.remove('pending');
  try{localStorage.setItem(DB.storage.key,JSON.stringify(guide.config));}catch{}
  setStatus(message??fmt(U.ready,{seed:guide.config.seed}));
 }catch(reason){setStatus(reason instanceof Error?reason.message:U.genericError,true);}
 finally{busy=false;button.disabled=false;report.setAttribute('aria-busy','false');}
}

function downloadGuide(kind){
 const json=kind==='json',data=json?JSON.stringify(currentGuide,null,E.numeric.padding):toMarkdown(currentGuide);
 const url=URL.createObjectURL(new Blob([data],{type:json?E.export.jsonMime:E.export.markdownMime}));
 const link=document.createElement('a');link.href=url;link.download=U.exportFile+(json?E.export.jsonExtension:E.export.markdownExtension);document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),E.export.revokeDelay);setStatus(U.exported);
}

function init(){
 try{validateDatabase();}catch(reason){setStatus(reason.message,true);return;}
 document.title=U.title;document.querySelector('meta[name=description]').content=U.description;
 document.querySelectorAll('[data-text]').forEach(element=>element.textContent=U[element.dataset.text]);
 buildControls();
 let config={...DB.defaults},restored=false;
 try{const saved=JSON.parse(localStorage.getItem(DB.storage.key));if(saved&&typeof saved==='object'){config=normalizeConfig(saved);restored=true;}}catch{}
 writeConfig(config);
 document.getElementById('composer-form').addEventListener('submit',event=>{event.preventDefault();runGeneration();});
 document.getElementById('composer-form').addEventListener('input',event=>{updateSongformDraft(event);refreshFields();document.getElementById('report').classList.add('pending');setStatus(U.changed);});
 document.getElementById('reset').addEventListener('click',()=>{writeConfig({...DB.defaults});runGeneration();});
 document.getElementById('controls').addEventListener('click',event=>{if(handleSongformAction(event))return;if(event.target.closest('[data-new-seed]')){makeNewSeed();return;}const button=event.target.closest('[data-preset]');if(button){writeConfig({...readConfig(),...DB.presets.find(preset=>preset.id===button.dataset.preset).values});runGeneration();}});
 document.getElementById('report').addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button||!currentGuide)return;
  const action=button.dataset.action;
  if(action==='copy'){try{await navigator.clipboard.writeText(toMarkdown(currentGuide));setStatus(U.copied);}catch{downloadGuide('markdown');setStatus(U.copyFailed);}}
  else if(action==='print')window.print();else downloadGuide(action);
 });
 window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('.section')].map(element=>({element,open:element.open}));printState.forEach(({element})=>element.open=true);});
 window.addEventListener('afterprint',()=>printState.forEach(({element,open})=>element.open=open));
 runGeneration(restored?U.restored:U.sample);
}
if(typeof document!=='undefined')init();
</script></body></html>
