function validateDatabase(){
 for(const table of['fields','genres','moods','styles','meters','keys','modes','forms','progressions','instruments','vocalRanges','subgenres']){
  const ids=DB[table].map(entry=>entry.id);if(new Set(ids).size!==ids.length)throw error('dbError',{detail:table});
 }
 for(const field of DB.fields)if(field.type==='select'&&!byId(field.table,DB.defaults[field.id]))throw error('dbError',{detail:field.id});
 for(const genre of DB.genres)if(DB.subgenres.filter(item=>item.parent===genre.id&&item.default).length!==E.numeric.unit)throw error('dbError',{detail:genre.id});
 for(const child of DB.subgenres){
  if(!byId('genres',child.parent)||!Object.keys(child.sourceMix).length||Object.entries(child.sourceMix).some(([id,weight])=>!byId('genres',id)||!Number.isFinite(weight)||weight<=0))throw error('dbError',{detail:child.id});
  if(child.bpm.length!==E.numeric.padding||child.bpm[0]>child.bpm.at(-1))throw error('dbError',{detail:child.id});
  for(const id of Object.keys(child.instruments??{}))if(!byId('instruments',id))throw error('dbError',{detail:id});
  for(const id of Object.keys(child.kitWeights??{}))if(!P.drumKits.some(kit=>kit.id===id))throw error('dbError',{detail:id});
  for(const kind of Object.keys(child.sections??{}))if(!DB.sectionTypes[kind])throw error('dbError',{detail:kind});
 }
 normalizeSongform(DB.defaults.customForm);
 for(const form of DB.forms.filter(form=>!form.builder))for(const[kind,bars]of form.sections)if(!DB.sectionTypes[kind]||bars<E.limits.minPattern||!Number.isInteger(bars))throw error('dbError',{detail:form.id});
 for(const mode of DB.modes){
  const chords=[...mode.chords,...mode.borrowed,...mode.applied];
  if(new Set(chords.map(chord=>chord.id)).size!==chords.length)throw error('dbError',{detail:mode.id});
  for(const chord of chords)if(!DB.qualities[chord.quality]||!DB.functions[chord.fn]||(chord.target&&!chords.some(item=>item.id===chord.target)))throw error('dbError',{detail:chord.id});
  for(const progression of DB.progressions)if(progression.grammar){
   const grammar=DB.progressionGrammars[progression.grammar];
   if(!grammar||grammar.slots[mode.id]?.length!==grammar.referenceBars||grammar.slots[mode.id].some(slot=>!slot.length||slot.some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
  }
  for(const progression of DB.progressions)if(progression.modes&&(!progression.modes[mode.id]||progression.modes[mode.id].some(id=>!chords.some(chord=>chord.id===id))))throw error('dbError',{detail:progression.id});
  for(const progression of DB.progressions)if(progression.weights&&(progression.weights.length!==progression.modes[mode.id].length||progression.weights.some(weight=>!Number.isFinite(weight)||weight<=0)))throw error('dbError',{detail:progression.id});
 }
 for(const role of E.arrangement.roles)if(!DB.instruments.some(item=>item.role===role))throw error('dbError',{detail:role});
 for(const meter of DB.meters)if(!P.meters[meter.id]||P.meters[meter.id].barTicks!==meter.quarters*P.ticksPerQuarter)throw error('dbError',{detail:meter.id});
 for(const kit of P.drumKits)for(const voice of[kit.kick,kit.snare,kit.time,...kit.fill])if(!P.drumVoices[voice])throw error('dbError',{detail:voice});
 for(const range of DB.vocalRanges)if(range.lower>=range.upper||range.center<range.lower||range.center>range.upper)throw error('dbError',{detail:range.id});
 return true;
}

 document.getElementById('form-total').textContent=fmt(DB.songformUI.total,{count:sequence.length,bars:sum(sequence.map(row=>row[1]))});
}
function handleSongformAction(event){
 const button=event.target.closest('[data-form-op]');
 if(!button)return false;
 const sequence=readSongformDraft(),index=Number(button.dataset.index),op=button.dataset.formOp,rules=DB.songformRules;
 if(op==='import'){const form=byId('forms',document.getElementById('form-import-source').value);sequence.splice(0,sequence.length,...form.sections.map(row=>[...row]));}
 if(op==='add'&&sequence.length<rules.maxSections)sequence.push([document.getElementById('form-add-type').value,rules.defaultBars]);
 if(op==='duplicate'&&sequence[index]&&sequence.length<rules.maxSections)sequence.splice(index+E.numeric.unit,0,[...sequence[index]]);
 if(op==='remove'&&sequence.length>rules.minSections)sequence.splice(index,E.numeric.unit);
 if(op==='up'&&index>0)[sequence[index-E.numeric.unit],sequence[index]]=[sequence[index],sequence[index-E.numeric.unit]];
 if(op==='down'&&index<sequence.length-E.numeric.unit)[sequence[index+E.numeric.unit],sequence[index]]=[sequence[index],sequence[index+E.numeric.unit]];
 document.getElementById('field-customForm').value=JSON.stringify(sequence);renderSongformEditor();document.getElementById('report').classList.add('pending');setStatus(U.changed);refreshFields();
 return true;
}
function buildControls(){
 const fieldHtml=field=>{
  const id=`field-${field.id}`,label=`<span class="field-label">${escapeHtml(field.label)}</span>`,help=field.help?`<small class="field-help" id="help-${field.id}">${escapeHtml(field.help)}</small>`:'',description=field.help?` aria-describedby="help-${field.id}"`:'';
  if(field.type==='songform')return`<fieldset class="songform-editor" id="wrap-${field.id}"><legend>${escapeHtml(field.label)}</legend><input type="hidden" id="${id}" name="${field.id}" value="${escapeHtml(JSON.stringify(DB.defaults[field.id]))}"><div id="songform-rows">${songformEditorMarkup(DB.defaults[field.id])}</div></fieldset>`;
  if(field.type==='select')return`<label class="field" for="${id}">${label}<select id="${id}" name="${field.id}"${description}>${selectOptions(field,DB.defaults).map(option=>`<option value="${escapeHtml(option.id)}">${escapeHtml(option.label)}</option>`).join('')}</select>${help}</label>`;
  if(field.type==='range')return`<div class="range-field"><div class="range-head"><label for="${id}">${escapeHtml(field.label)}</label><output for="${id}" id="output-${field.id}"></output></div><input type="range" id="${id}" name="${field.id}" min="${field.min}" max="${field.max}" step="${field.increment}"${description}>${help}<div class="range-ends"><span>${escapeHtml(field.ends[0])}</span><span>${escapeHtml(field.ends[1])}</span></div></div>`;
  return`<label class="field" for="${id}" id="wrap-${field.id}">${label}<input type="${field.type}" id="${id}" name="${field.id}"${field.type==='number'?` min="${field.min}" max="${field.max}" step="${field.increment}"`:` maxlength="${field.maxLength}"`}${field.placeholder?` placeholder="${escapeHtml(field.placeholder)}"`:''}${description} required>${help}</label>`;
 };
 const groupHtml=step=>{
  const fields=DB.fields.filter(field=>field.step===step),rendered=new Set();
  return fields.map(field=>{
   if(rendered.has(field.id))return'';
   if(field.pair){const pair=fields.filter(item=>item.pair===field.pair);pair.forEach(item=>rendered.add(item.id));return`<div class="pair">${pair.map(fieldHtml).join('')}</div>`;}
   return fieldHtml(field);
  }).join('');
 };
 document.getElementById('controls').innerHTML=`<div class="field-label">${escapeHtml(U.presets)}</div><div class="preset-row">${DB.presets.map(preset=>`<button class="preset" type="button" data-preset="${escapeHtml(preset.id)}">${escapeHtml(preset.label)}</button>`).join('')}</div>${U.steps.map((step,index)=>`<details class="settings-group"${index===0?' open':''}><summary class="step"><span>${String(index+E.numeric.unit).padStart(E.numeric.padding,'0')}</span>${escapeHtml(step)}</summary>${groupHtml(index)}</details>`).join('')}<details class="advanced"><summary>${escapeHtml(U.advanced)}</summary>${groupHtml('advanced')}<button type="button" data-new-seed>${escapeHtml(DB.seedUI.newSeed)}</button></details><section class="setting-preview" id="setting-preview" aria-live="polite"></section>`;
}

function writeConfig(config){
 const values={...DB.defaults,...config};
 for(const field of DB.fields){
  if(field.type==='select')values[field.id]=setSelectInput(field,values);
  else document.getElementById(`field-${field.id}`).value=field.type==='songform'?JSON.stringify(typeof values[field.id]==='string'?JSON.parse(values[field.id]):values[field.id]):values[field.id];
 }
 renderSongformEditor();refreshFields();
}
function readConfig(){return Object.fromEntries(DB.fields.map(field=>[field.id,document.getElementById(`field-${field.id}`).value]));}
function refreshFields(){
 const config=readConfig();
 for(const field of DB.fields.filter(field=>field.parent)){
  const input=document.getElementById(`field-${field.id}`);
  if(input.dataset.parentChoice!==config[field.parent.field])config[field.id]=setSelectInput(field,config);
 }
 for(const field of DB.fields){
  const input=document.getElementById(`field-${field.id}`);

  if(field.when){const show=document.getElementById(`field-${field.when.field}`).value===field.when.value;document.getElementById(`wrap-${field.id}`).hidden=!show;input.disabled=!show;}
  if(field.type==='songform')document.getElementById(`wrap-${field.id}`).disabled=input.disabled;
 }

 const selected=byId('subgenres',config.subgenre);

let resultState={section:0,part:DB.resultUI.tabs[0].id,bar:0};

function timingUnit(value,part){return fmt(part.displayTicks===P.ticksPerQuarter?DB.resultUI.unit:DB.resultUI.eighthUnit,{value:Number(value.toFixed(P.display.decimals))});}
function beatLabels(part){

}
function noteTiming(event,part){
 return{start:timingUnit(event.start%part.barTicks/part.displayTicks+E.numeric.unit,part),length:timingUnit(event.duration/part.displayTicks,part)};
}

function renderNotePattern(events,part){

 const lanes=pitches.map(pitch=>({label:events.find(event=>event.pitch===pitch).note,events:events.filter(event=>event.pitch===pitch),rest:false}));
 if(events.some(event=>event.role==='rest'))lanes.push({label:ui.rest,events:events.filter(event=>event.role==='rest'),rest:true});
 return`<div class="note-pattern" style="--ticks:${part.barTicks}"><div class="note-ruler"><span></span><div class="beat-grid" style="--ticks:${part.barTicks}">${beatLabels(part)}</div></div>${lanes.map(lane=>`<div class="note-row"><span class="note-label mono">${escapeHtml(lane.label)}</span><div class="note-lane">${lane.events.map(event=>{const timing=noteTiming(event,part),left=(event.start%part.barTicks)/part.barTicks*E.numeric.percent,width=event.duration/part.barTicks*E.numeric.percent;return`<span class="piano-note${lane.rest?' note-rest':''}" style="left:${left}%;width:${width}%" title="${escapeHtml(fmt(ui.noteExample,{note:lane.label,...timing}))}">${lane.rest?'':escapeHtml(lane.label)}</span>`;}).join('')}</div></div>`).join('')}</div>`;

function renderDrumPattern(events,part){

 return`<div class="drum-pattern" style="--ticks:${part.barTicks}"><div class="drum-row"><span></span>${beatLabels(part)}</div>${voices.map(voice=>`<div class="drum-row"><span class="drum-label">${escapeHtml(P.drumVoices[voice].label)}</span>${Array.from({length:part.barTicks},(_,tick)=>{const hit=events.find(event=>event.voice===voice&&event.start%part.barTicks===tick);return`<span class="drum-cell${hit?' grid-hit':''}${tick%part.displayTicks?'':' cell-strong'}"${hit?` role="img" aria-label="${escapeHtml(fmt(ui.hit,{voice:P.drumVoices[voice].label,start:timingUnit(tick/part.displayTicks+E.numeric.unit,part),velocity:hit.velocity}))}" title="${escapeHtml(fmt(PU.velocity,hit))}"`:''}>${hit?escapeHtml(ui.hitSymbol):''}</span>`;}).join('')}</div>`).join('')}</div>`;

function renderPartPlans(section,track=resultState.part,bar=resultState.bar){
 const ui=DB.resultUI,part=section.parts,tab=ui.tabs.find(tab=>tab.id===track),drum=track==='drums';
 const events=eventsInBar(part[track].events,bar,part);

 const facts=partFacts(section),range=part[track].range,summary=drum?part.drums.kit:range.low+U.rangeSeparator+range.high;

 return`<div class="track-workspace" style="--track:var(--${tab.color})"><div class="track-heading"><h3>${escapeHtml(tab.label)}</h3><span class="track-facts">${escapeHtml(summary)}</span></div><p class="instruction">${escapeHtml(tab.hint)}</p><nav class="bar-nav" aria-label="${escapeHtml(ui.barLabel)}">${nav}</nav><div class="bar-heading"><strong>${escapeHtml(fmt(ui.barTitle,{bar:bar+E.numeric.unit}))}</strong><span>${escapeHtml(fmt(ui.absoluteBar,{bar:section.start+bar}))}</span></div><p class="timing-help">${escapeHtml(part.displayTicks===P.ticksPerQuarter?ui.timing:ui.compoundTiming)}</p>${drum?renderDrumPattern(events,part):renderNotePattern(events,part)}<p class="timing-help">${escapeHtml(facts.swing)}</p>${events.length?(drum?`<details class="input-details"><summary>${escapeHtml(ui.tableView)}</summary>${table}</details>`:table):`<p class="instruction">${escapeHtml(ui.empty)}</p>`}<p class="repeat-note">${escapeHtml(fmt(ui.repeatHelp,{repeats:section.repeats,bars:section.bars}))}</p><details class="input-details"><summary>${escapeHtml(ui.playingDetails)}</summary><p>${escapeHtml(drum?PU.drumRules:track==='bass'?PU.bassRules:PU.melodyRules)}</p>${track==='topline'?`<p>${escapeHtml(facts.motif)}</p>`:''}</details></div>`;
}
function renderSectionWorkspace(guide){
 const ui=DB.resultUI,section=guide.sections[resultState.section],tab=ui.tabs.find(tab=>tab.id===resultState.part);
 const navigation=resultButton('section',section.index-E.numeric.unit,escapeHtml(ui.previous),section.index===0?'disabled':'')+resultButton('section',section.index+E.numeric.unit,escapeHtml(ui.next),section.index===guide.sections.length-E.numeric.unit?'disabled':'');
 const tabs=ui.tabs.map((item,index)=>resultButton('part',item.id,`<span>${index+E.numeric.unit}</span>${escapeHtml(item.label)}`,`aria-pressed="${item.id===resultState.part}" style="--track:var(--${item.color})"`)).join('');
 const content=tab.id==='chords'?`<div class="chord-workspace"><p class="instruction">${escapeHtml(tab.hint)} <strong>${escapeHtml(fmt(ui.phrase,{bars:section.phraseBars,repeats:section.repeats}))}</strong></p>${renderChordCards(section.phrase)}<div class="instrument-strip"><span>${escapeHtml(U.arrangement)}</span>${section.arrangement.instruments.map(item=>`<span class="instrument-chip">${escapeHtml(item.label)}</span>`).join('')}</div><details class="input-details"><summary>${escapeHtml(ui.keyboard)}</summary>${renderChordTable(section)}<p class="timing-help">${escapeHtml(U.octaveHint)}</p></details><div class="transition-note"><strong>${escapeHtml(U.transition)}</strong><p>${escapeHtml(section.transition)}</p></div></div>`:renderPartPlans(section);
 return`<section class="panel section-workspace" id="result-section" aria-label="${escapeHtml(ui.sectionLabel)}"><div class="section-workspace-head"><div><span class="eyebrow">${escapeHtml(U.sectionsTitle)}</span><h2>${escapeHtml(section.label)} <span>${escapeHtml(fmt(ui.range,section))}</span></h2></div><div class="section-paging">${navigation}</div></div><nav class="result-tabs" aria-label="${escapeHtml(ui.partLabel)}">${tabs}</nav><div class="section-task" aria-live="polite">${content}</div></section>`;
}
function renderGuide(guide,reset=true){
 const ui=DB.resultUI;
 if(reset)resultState={section:Math.max(0,guide.sections.findIndex(section=>section.kind===ui.startKind)),part:ui.tabs[0].id,bar:0};
 const list=items=>`<ul class="guidance-list">${items.map(item=>`<li><strong>${escapeHtml(item.title)}</strong><p>${escapeHtml(item.body)}</p></li>`).join('')}</ul>`;
 const diagnostic=Object.entries(guide.diagnostics).map(([key,value])=>`<div><strong>${value}${['borrowed','applied','extension','swing'].includes(key)?U.percentage:''}</strong><small>${escapeHtml(U[key])}</small></div>`).join('');
 const steps=ui.steps.map((step,index)=>`<a class="result-step" href="#${step.target}"><span>${index+E.numeric.unit}</span><div><strong>${escapeHtml(step.title)}</strong><small>${escapeHtml(step.body)}</small></div></a>`).join('');
 const sections=guide.sections.map(section=>resultButton('section',section.index,`<span class="form-energy" style="height:${E.display.diagramBase*E.numeric.percent+section.energy*E.display.diagramEnergy}%"></span><strong>${escapeHtml(section.label)}</strong><small>${escapeHtml(fmt(ui.range,section))}</small>`,`class="form-block" style="--section:var(--${ui.sectionColors[section.kind]})" aria-current="${section.index===resultState.section}"`)).join('');
 const reference=guide.progressionPlan?`<details class="input-details reference"><summary>${escapeHtml(guide.progressionPlan.title)}</summary>${renderChordCards(guide.progressionPlan.events)}<p class="timing-help">${escapeHtml(ui.referenceHelp)}</p></details>`:'';
 document.getElementById('report').innerHTML=`<section class="brief"><div><div class="eyebrow">${escapeHtml(U.briefEyebrow)}</div><h2>${escapeHtml(guide.summary.title)}</h2><small>${escapeHtml(guide.summary.subtitle)}</small><small>${escapeHtml(guide.summary.subgenre)}</small></div><div class="brief-stats"><div class="stat"><strong class="mono">${guide.config.bpm}</strong><span>${escapeHtml(U.bpm)}</span></div><div class="stat"><strong class="mono">${guide.bars}</strong><span>${escapeHtml(U.bars)}</span></div><div class="stat"><strong class="mono">${formatDuration(guide.seconds)}</strong><span>${escapeHtml(U.duration)}</span></div></div></section><nav class="result-steps" aria-label="${escapeHtml(ui.title)}">${steps}</nav><div class="report-header"><h2>${escapeHtml(U.reportTitle)}</h2><div class="actions">${['copy','markdown','json','print'].map(action=>`<button type="button" data-action="${action}">${escapeHtml(U[action])}</button>`).join('')}</div></div><section class="panel structure-panel" id="result-structure"><div class="panel-top"><h3>${escapeHtml(U.energyTitle)}</h3><small>${escapeHtml(U.energyHint)}</small></div><nav class="form-map" aria-label="${escapeHtml(ui.sectionLabel)}">${sections}</nav><p class="timing-help">${escapeHtml(fmt(ui.total,{count:guide.sections.length,bars:guide.bars}))}</p></section>${renderSectionWorkspace(guide)}${reference}<section class="panel daw-panel" id="result-daw"><div class="panel-top"><h3>${escapeHtml(U.dawTitle)}</h3></div><ol class="checklist">${guide.daw.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol></section><details class="engine-details"><summary>${escapeHtml(ui.details)}</summary><div class="overview-grid"><div>${list(guide.harmony)}</div><div>${list(guide.melody)}</div></div></details><details class="engine-details"><summary>${escapeHtml(U.methodTitle)}</summary><p class="trace">${escapeHtml(PU.method)}</p><div class="engine-grid">${diagnostic}</div><div class="sources">${DB.theoryReferences.map(source=>`<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a>`).join('')}</div></details><details class="engine-details"><summary>${escapeHtml(ui.saved)}</summary><div class="tags"><span class="tag accent">${escapeHtml(fmt(U.seedTag,{seed:guide.config.seed}))}</span><span class="tag">${escapeHtml(fmt(U.versionTag,{version:guide.version}))}</span></div><p class="trace">${escapeHtml(DB.seedUI.help)}</p></details>`;
}
function handleResultAction(event){
 const button=event.target.closest('[data-result-action]');if(!button||!currentGuide)return false;
 const action=button.dataset.resultAction,value=button.dataset.resultValue,section=currentGuide.sections[resultState.section];
 if(action==='section'){
  const index=Number(value);if(!Number.isInteger(index)||!currentGuide.sections[index])return true;
  resultState.section=index;resultState.bar=0;
 }
 if(action==='part'){
  if(!DB.resultUI.tabs.some(tab=>tab.id===value))return true;resultState.part=value;
 }
 if(action==='bar'){
  const bar=Number(value);if(!Number.isInteger(bar)||bar<0||bar>=section.parts.bars)return true;resultState.bar=bar;
 }
 renderGuide(currentGuide,false);
 document.getElementById('report').querySelector(`[data-result-action="${action}"][data-result-value="${value}"]`)?.focus({preventScroll:true});
 return true;
}
function renderPrintableGuide(guide){
 if(!guide)return'';
 return`<h1>${escapeHtml(DB.resultUI.printTitle)}</h1><p>${escapeHtml(guide.summary.title)} · ${guide.config.bpm} ${escapeHtml(U.bpm)} · ${guide.bars} ${escapeHtml(U.bars)}</p>${guide.sections.map(section=>`<section class="section"><h2>${escapeHtml(section.label)} · ${escapeHtml(fmt(DB.resultUI.range,section))}</h2><p>${escapeHtml(fmt(U.phraseHint,section))}</p>${renderChordCards(section.phrase)}${renderChordTable(section)}${renderFullPartPlans(section)}</section>`).join('')}<h2>${escapeHtml(U.dawTitle)}</h2><ol>${guide.daw.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol>`;
}


function setStatus(message,isError=false){const status=document.getElementById('status');status.textContent=message;status.dataset.error=String(isError);}
let currentGuide=null,busy=false;
async function runGeneration(message=null){
 if(busy)return;
 busy=true;
 const button=document.getElementById('generate'),report=document.getElementById('report');
 button.disabled=true;report.setAttribute('aria-busy','true');setStatus(U.generating);
 await new Promise(resolve=>setTimeout(resolve,E.timing.renderYield));
 try{
  const guide=generateGuide(readConfig());currentGuide=guide;writeConfig(guide.config);renderGuide(guide);report.classList.remove('pending');
  try{localStorage.setItem(DB.storage.key,JSON.stringify(guide.config));}catch{}
  setStatus(message??fmt(U.ready,{seed:guide.config.seed}));
 }catch(reason){setStatus(reason instanceof Error?reason.message:U.genericError,true);}
 finally{busy=false;button.disabled=false;report.setAttribute('aria-busy','false');}
}

function downloadGuide(kind){
 const json=kind==='json',data=json?JSON.stringify(currentGuide,null,E.numeric.padding):toMarkdown(currentGuide);
 const url=URL.createObjectURL(new Blob([data],{type:json?E.export.jsonMime:E.export.markdownMime}));
 const link=document.createElement('a');link.href=url;link.download=U.exportFile+(json?E.export.jsonExtension:E.export.markdownExtension);document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),E.export.revokeDelay);setStatus(U.exported);
}

function init(){
 try{validateDatabase();}catch(reason){setStatus(reason.message,true);return;}
 for(const[key,value]of Object.entries(DB.visualTheme))document.documentElement.style.setProperty('--'+key,value);
 document.title=U.title;document.querySelector('meta[name=description]').content=U.description;
 document.querySelectorAll('[data-text]').forEach(element=>element.textContent=U[element.dataset.text]);
 buildControls();
 let config={...DB.defaults},restored=false;
 try{const saved=JSON.parse(localStorage.getItem(DB.storage.key));if(saved&&typeof saved==='object'){config=normalizeConfig(saved);restored=true;}}catch{}
 writeConfig(config);
 document.getElementById('composer-form').addEventListener('submit',event=>{event.preventDefault();runGeneration();});
 document.getElementById('composer-form').addEventListener('input',event=>{updateSongformDraft(event);refreshFields();document.getElementById('report').classList.add('pending');setStatus(U.changed);});
 document.getElementById('reset').addEventListener('click',()=>{writeConfig({...DB.defaults});runGeneration();});
 document.getElementById('controls').addEventListener('click',event=>{if(handleSongformAction(event))return;if(event.target.closest('[data-new-seed]')){makeNewSeed();return;}const button=event.target.closest('[data-preset]');if(button){writeConfig({...readConfig(),...DB.presets.find(preset=>preset.id===button.dataset.preset).values});runGeneration();}});
 document.getElementById('report').addEventListener('click',async event=>{
  if(handleResultAction(event))return;
  const button=event.target.closest('[data-action]');if(!button||!currentGuide)return;
  const action=button.dataset.action;
  if(action==='copy'){try{await navigator.clipboard.writeText(toMarkdown(currentGuide));setStatus(U.copied);}catch{downloadGuide('markdown');setStatus(U.copyFailed);}}
  else if(action==='print')window.print();else downloadGuide(action);
 });
 window.addEventListener('beforeprint',()=>{document.getElementById('print-report').innerHTML=renderPrintableGuide(currentGuide);});
 window.addEventListener('afterprint',()=>{document.getElementById('print-report').innerHTML='';});
 runGeneration(restored?U.restored:U.sample);
}
if(typeof document!=='undefined')init();
</script></body></html>
